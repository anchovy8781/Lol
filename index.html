<style>

:root{

  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.5px}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}

.between{justify-content:space-between}

.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}

.date{font-family:var(--f-mono);font-size:13px;text-align:right}

.kpi{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;font-family:var(--f-mono)}
.kpi.alert{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:960px){.side{position:static}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.bad>i{background:var(--bad)}.bar.warn>i{background:var(--warn)}
.meter{display:flex;flex-direction:column;gap:4px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:6px 6px}

.tbl{overflow-x:auto}

.blocks{display:flex;gap:3px;flex-wrap:wrap}

.log{display:flex;flex-direction:column;gap:0;max-height:520px;overflow:auto}
.log div{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:13px}
.log span:first-child{font-family:var(--f-mono);color:var(--muted);font-size:12px}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:640px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}

.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);padding:10px 12px;border-radius:var(--r);width:100%}
.choice:hover{border-color:var(--accent)}
.choice small{color:var(--muted);font-size:12px}
.choices{display:flex;flex-direction:column;gap:8px}

.setup{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.hero h1{font-size:clamp(34px,7vw,54px);line-height:1.05}
.hero p{max-width:62ch;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}

.opt span{font-size:12.5px;color:var(--muted)}
.opt em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13px}
.callout.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}

.ending h1{font-size:clamp(30px,6vw,46px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
</style>

/* ============ 상태 ============ */
let s=null, ui={tab:'dash', confirm:null, setup:{ind:'saas',bg:'dev',cof:'none',vest:true,name:'',co:''}};
const ind=()=>IND[s.ind];
const KEY='startup-sim-save-v1';

function newGame(c){
  const b=BG[c.bg], I=IND[c.ind];
  s={ind:c.ind,bg:c.bg,co:c.co||'주식회사 새싹랩',fname:c.name||'대표',vest:c.vest,
    month:0,cash:b.cap-6e5,capital:b.cap,

    quality:4,debt:4,pmf:4,fit:clamp(rnd(0.42,0.95)+(c.bg==='serial'?0.05:0),0.3,1),users:0,supply:0,brand:2,comp:0,
    price:I.base,ad:0,brandAd:0,focus:'balance',crunch:false,crunchM:0,office:'home',
    team:[],cands:[],alloc:{dev:b.dev>40?4:0,interview:2,sales:b.dev>40?1:4,ir:0,recruit:0,manage:0,gov:0,rest:1},
    cap:[{n:c.name||'대표',t:'me',pct:1,inv:0}],esopFree:0,
    rounds:[],fund:null,gov:{chogi:'none',tips:'none',kibo:'none',center:'none'},tipsOK:false,grants:[],loan:null,
    retire:0,loss:0,yp:{},vat:{out:0,in:0},climate:1,ctrend:0,
    hist:[],log:[],pending:[],last:null,deposit:0,flags:{},pivots:0,erVisits:0,ipo:null,extra:[],ended:null,nextId:1,cofVest:0};
  if(c.cof!=='none'){const C=COF[c.cof];
    s.team.push({id:s.nextId++,name:pickName(),role:C.role,lv:3,skill:C.skill,salary:C.salary||0,morale:80,ten:0,ramp:1,opt:0,cof:true});
    s.cap=[{n:s.fname,t:'me',pct:1-C.pct,inv:0},{n:'공동창업자 '+s.team[0].name,t:'cof',pct:C.pct,inv:0}];

  }
  addLog(`${s.co} 법인 설립. 자본금 ${won(b.cap)}. 등기·등록면허세 등 60만원 지출.`);
  addLog(`아이템: ${I.ex} (${I.name}).`);

function pickName(){return pick(SUR)+pick(GIV)}
function addLog(t,m){s.log.unshift({m:m??s.month,t})}

/* ============ 계산 헬퍼 ============ */
const headcount=()=>s.team.length;
const eff=e=>e.skill*(0.5+0.5*e.ramp)*(0.55+0.9*e.morale/100);
const byRole=r=>s.team.filter(e=>e.role===r);
const pow=r=>byRole(r).reduce((a,e)=>a+eff(e),0);
const officeCost=()=>{const o=OFFICES[s.office];return (o.fixed+o.per*(headcount()+1))*(s.rentMul||1)};
function payroll(){return s.team.reduce((a,e)=>a+e.salary/12,0)+s.F.salary}
function adminCap(){return 7+byRole('ops').length*14}
function blocksAvail(){let b=8;const over=headcount()+1-adminCap();if(over>0)b-=Math.ceil(over/6);if(s.F.energy<20)b-=2;if(s.flags.forcedRest)b=3;return Math.max(1,b)}
function allocTotal(){return Object.values(s.alloc).reduce((a,b)=>a+b,0)}
function priceRatio(){return s.price/ind().base}
function revenueHist(n){return s.hist.slice(-n).map(h=>h.rev)}
function growth(w=3){const h=s.hist;if(h.length<2)return 0;const k=Math.min(w,h.length-1);const a=h[h.length-1-k].rev,b=h[h.length-1].rev;if(a<=0)return b>0?0.3:0;return Math.pow(b/a,1/k)-1}
function lastRev(){return s.last?s.last.rev:0}
function burn(){return s.last?Math.max(0,-s.last.net):0}
function runway(){const b=burn();return b<=0?Infinity:s.cash/b}
function seanEllis(){return clamp(s.pmf*0.56+(s.flags.seNoise||0),0,90)}
function myPct(){const me=s.cap.find(c=>c.t==='me');return me?me.pct:0}
function investorsIn(){return s.cap.filter(c=>c.t==='inv')}
function deadEquity(){return s.cap.filter(c=>c.t==='dead').reduce((a,c)=>a+c.pct,0)}
function stageIdx(){let i=-1;for(const r of s.rounds){const j=ROUNDS.findIndex(x=>x.k===r.k);if(j>i)i=j}return i}
function fairVal(){
  const I=ind(),rev=s.hist.slice(-3).reduce((a,h)=>a+h.rev,0)/Math.max(1,Math.min(3,s.hist.length)),arr=rev*12,g=clamp(growth(6),-0.08,0.25);
  const mult=Math.max(1.5,(4+g*55+s.pmf/22))*I.valMul;
  const revVal=arr*mult;
  const teamVal=7e8+s.quality*1.6e7+s.pmf*3.2e7+s.F.network*4e6+s.team.reduce((a,e)=>a+(e.lv>=2?6e7:2e7),0);
  const userVal=s.ind==='app'?s.users*2500:0;
  let v=Math.max(teamVal,revVal+userVal*0.5,userVal)*s.climate;
  if(deadEquity()>0.12)v*=0.8;
  return v;
}
function estVal(){return s.rounds.length?Math.max(fairVal(),0):fairVal()}

/* ============ 후보자 ============ */
function genCands(){
  const A=s.alloc,n=Math.floor(1+(A.recruit||0)*1.3+s.brand/25+Math.min(2,s.rounds.length*0.6)+R()*1.5);
  const need=[];
  const devs=byRole('dev').length;
  need.push('dev','dev','dev');if(devs>=2)need.push('design','pm');if(s.users>50)need.push('cs','mkt');
  if(s.ind==='saas'||s.ind==='market')need.push('sales','sales');else need.push('mkt');
  if(headcount()>=6)need.push('ops','data','pm');
  s.cands=[];
  for(let i=0;i<Math.min(n,7);i++){
    const role=s.recruitFocus&&s.recruitFocus!=='any'&&R()<0.65?s.recruitFocus:pick(need);
    const stage=stageIdx();
    const lvW=[0.5,0.35,0.13+stage*0.03,0.02+stage*0.03];let x=R()*lvW.reduce((a,b)=>a+b),lv=0;for(;lv<3&&x>lvW[lv];lv++)x-=lvW[lv];
    const skill=clamp([ri(30,54),ri(48,72),ri(64,86),ri(76,95)][lv],20,99);
    const mk=ROLES[role].mk[lv]*1e4;
    const ask=Math.round(mk*rnd(0.92,1.12)*(1+(skill-[42,60,75,85][lv])/120)/1e6)*1e6;
    s.cands.push({id:s.nextId++,name:pickName(),role,lv,skill,ask,wantOpt:lv>=2||R()<0.25});
  }
}
function offerChance(c,mult,opt){
  let p=0.38+s.brand/220+Math.min(0.3,s.rounds.length*0.08)+OFFICES[s.office].morale*0.03+(mult-1)*2.6+(opt?0.16:0)+(s.alloc.recruit||0)*0.03;
  if(c.lv>=2&&!s.rounds.length)p-=0.25;
  if(c.wantOpt&&!opt)p-=0.12;
  if(runway()<6)p-=0.2;
  if(s.F.youth&&c.lv>=2)p-=0.05;
  return clamp(p,0.03,0.95);
}
const optGrant=lv=>[0.0005,0.001,0.003,0.006][lv];
function ensureEsop(){let e=s.cap.find(c=>c.t==='esop');if(!e){dilute(0.1,{n:'스톡옵션 풀(ESOP)',t:'esop',pct:0.1,inv:0});s.esopFree=0.1;addLog('스톡옵션 풀 10% 설정. 기존 주주 지분 희석.')}}
function dilute(newPct,entry){for(const c of s.cap)c.pct*=1-newPct;const ex=s.cap.find(c=>c.n===entry.n&&c.t===entry.t);if(ex){ex.pct+=newPct;ex.inv+=entry.inv||0}else s.cap.push({...entry,pct:newPct})}

/* ============ 월간 시뮬레이션 ============ */
function simulate(){
  const I=ind(),A=s.alloc,F=s.F,m=s.month,cal=calM(m);
  {let over=allocTotal()-blocksAvail();for(const k of ['rest','gov','manage','recruit','ir','sales','interview','dev']){while(over>0&&A[k]>0){A[k]--;over--}}}
  const notes=[];const note=(t,c)=>{notes.push({t,c});addLog(t,m)};
  const crunchM=s.crunch?1.22:1;
  // 특수 상태
  const poc=s.flags.poc?0.7:1;
  // ---- 제품 개발 ----
  const devs=byRole('dev').length,pms=byRole('pm').length;
  let devPow=(pow('dev')*crunchM+A.dev*F.dev/8)*poc;
  devPow*=1/(1+0.05*Math.max(0,devs-3)*(pms?0.45:1));
  if(s.debt>60)devPow*=1-(s.debt-60)/110;
  const designPow=pow('design')*crunchM;
  const fq={feature:1.28,balance:1,stable:0.45}[s.focus];
  let dq=(devPow*0.13+designPow*0.05)*Math.pow(1-s.quality/104,1.4)*fq-(s.quality>I.mvp?0.35+Math.min(0.6,s.month*0.006)+s.comp*0.4:0.1);
  s.quality=clamp(s.quality+dq,0,100);
  const dd={feature:devPow*0.05,balance:devPow*0.018-0.4,stable:-devPow*0.07-0.8}[s.focus]+(s.crunch?1.2:0)+(s.users>I.tam*0.05?0.6:0);
  s.debt=clamp(s.debt+dd,0,100);
  // ---- PMF ----
  const qF=s.quality/100;
  const target=s.fit*100*(0.28+0.72*qF);
  const rate=clamp(0.035+0.035*A.interview+(s.users>=30?0.03:0)+pow('data')/60*0.03+pow('pm')/70*0.02,0,0.45);
  s.pmf=clamp(s.pmf+(target-s.pmf)*rate,0,100);
  s.flags.seNoise=rnd(-3,3);
  const pF=s.pmf/100;
  // ---- 브랜드 ----
  s.brand=clamp(s.brand*0.965+3*Math.log2(1+s.brandAd/2e6)+pow('mkt')/90+(OFFICES[s.office].k||0)+(s.office==='gangnam'?0.6:0),0,100);
  // ---- 고객 획득 ----
  const gate=clamp((s.quality-I.mvp)/24+0.08,0.04,1)*(1+pow('design')/400);
  const pr=priceRatio();
  const pConv=s.ind==='market'?Math.pow(pr,-0.6):Math.pow(pr,-1.3);
  const pChurn=s.ind==='market'?Math.pow(pr,0.3):Math.pow(pr,0.6);
  const salesPow=pow('sales')/60+A.sales*(F.sales/60)/8*1.35;
  const mktMul=Math.min(2.4,1+pow('mkt')/140+pow('data')/300);
  const effCAC=I.cac*Math.pow(1+s.ad/(I.cac*600),0.45)/((0.42+pF)*mktMul)*(1+s.comp*0.6);
  let paid=s.ad>0?s.ad/effCAC*gate*pConv:0;
  let organic=(s.users*I.viral*(0.2+1.6*pF)+s.brand*I.tam*0.000011+(s.ind==='app'?I.tam*0.00002*qF:0))*gate*Math.sqrt(pConv);
  let sales=0;
  if(s.ind==='saas')sales=salesPow*4*(0.35+pF)*gate*pConv;
  else if(s.ind==='app')sales=salesPow*120*gate;
  else if(s.ind==='commerce')sales=salesPow*90*gate;
  if(s.flags.boost){organic+=s.flags.boost;s.flags.boost=0}
  const sat=Math.max(0.02,1-s.users/I.tam);
  let newU=(organic+paid+sales)*sat;
  // 마켓플레이스 공급
  let liq=1;
  if(s.ind==='market'){
    s.supply=Math.max(0,s.supply*(1-0.05*Math.pow(pr,1.5))+salesPow*28+newU*0.025);
    liq=clamp(s.supply*14/Math.max(1,s.users*0.9),0,1);
    newU*=0.4+0.6*liq;
  }
  // ---- 이탈 ----
  const csCov=(I.csBase+pow('cs')/60*I.csPer)/Math.max(1,s.users);
  const csF=csCov>=1?1:Math.min(2.6,1+1.3*(1-csCov));
  let churnR=I.churn*(1.55-pF)*(1+s.debt/130)*pChurn*csF*(s.flags.outage?1.5:1)*(s.ind==='market'?1.3-0.3*liq:1)*(1+s.comp*0.25);
  churnR=clamp(churnR,0.004,0.6);
  const churned=s.users*churnR;
  const prevUsers=s.users;
  s.users=Math.max(0,s.users+newU-churned);
  s.flags.outage=0;
  // ---- 매출 ----
  const U=s.users;let rev=0,cogs=0,ship=0,pg=0,store=0,gmv=0,paying=0,orders=0;
  if(s.ind==='saas'){rev=U*s.price}
  else if(s.ind==='app'){paying=U*I.payConv*(0.5+pF)*Math.pow(pr,-0.7);rev=paying*s.price;store=rev*I.storeFee}
  else if(s.ind==='commerce'){orders=U*I.freq*(0.8+0.4*pF);rev=orders*s.price;const scale=Math.max(1,orders/800);cogs=rev*I.cogs*(1-0.07*Math.log10(scale))*(s.flags.cogsShock?1.1:1);ship=orders*I.ship;pg=rev*I.pg}
  else{const tx=U*0.95*liq;gmv=tx*I.gmv;rev=gmv*s.price;pg=gmv*I.pg}
  let extraRev=0;s.extra=s.extra.filter(x=>{extraRev+=x.amt;return --x.left>0});
  rev+=extraRev;
  // ---- 비용 ----
  const pay=payroll(),ins=pay*0.105,ret=pay*0.0833-s.F.salary*0.0833;
  s.retire+=ret;
  const rent=officeCost();
  const server=(I.serverBase*(s.quality>15?1:0.3)+U*I.serverPer*(1+s.debt/220))*(s.ind==='app'?1:1);
  const hc=headcount()+1;
  const tools=hc*120000,misc=hc*160000,acct=250000+hc*6000;
  const ad=s.ad,brandAd=s.brandAd;
  let interest=0,principal=0;
  if(s.loan){interest=s.loan.bal*s.loan.rate/12;if(s.loan.grace>0)s.loan.grace--;else{principal=Math.min(s.loan.bal,s.loan.orig/36)}s.loan.bal-=principal;if(s.loan.bal<=1){note('기술보증기금 보증대출 상환 완료.','good');s.loan=null}}
  let grant=0;s.grants=s.grants.filter(g=>{if(g.at<=m){grant+=g.amt;if(--g.left>0){g.at=m+1;return true}return false}return true});
  const ipoCost=s.ipo&&s.ipo.left>0?3.5e7:0;
  const opCost=pay+ins+rent+server+tools+misc+acct+ad+brandAd+cogs+ship+pg+store+ipoCost;
  // ---- 세금 ----
  let vatPay=0,corpTax=0;
  s.vat.out+=rev*0.1;s.vat.in+=(rent+server+tools+misc*0.5+ad+brandAd+cogs+ship+pg+store)*0.1;
  if([1,4,7,10].includes(cal)&&m>0){vatPay=Math.round(s.vat.prevOut-s.vat.prevIn)||0;}
  if([12,3,6,9].includes(cal)){s.vat.prevOut=s.vat.out;s.vat.prevIn=s.vat.in;s.vat.out=0;s.vat.in=0}
  const y=calY(m);s.yp[y]=(s.yp[y]||0)+rev-opCost-ret-interest;
  if(cal===3&&s.yp[y-1]!==undefined){
    const p=s.yp[y-1];
    if(p<0){s.loss+=-p;note(`법인세 신고: ${y-1}년 결손 ${won(-p)}. 이월결손금 누적 ${won(s.loss)} (15년간 공제).`)}
    else{const use=Math.min(p,s.loss);s.loss-=use;const base=p-use;let t=base<=2e8?base*0.09:base<=2e10?1.8e7+(base-2e8)*0.19:3.78e9+(base-2e10)*0.21;
      if(y-1-2027<5)t*=0.5;corpTax=t*1.1;
      note(`법인세 신고: 과세표준 ${won(base)} → 법인세+지방소득세 ${won(corpTax)}${y-1-2027<5?' (창업중소기업 세액감면 50% 적용)':''}.`)}
  }
  if(vatPay)note(vatPay>0?`부가가치세 ${won(vatPay)} 납부.`:`부가가치세 ${won(-vatPay)} 환급.`);
  const net=rev-opCost-interest-principal+grant-vatPay-corpTax;
  s.cash+=net;
  // ---- 팀 ----
  const g=growth();
  const rw=runway();
  const overCap=hc>OFFICES[s.office].cap;
  const quits=[];
  for(const e of s.team){
    let d=(62-e.morale)*0.06+A.manage*1.6*Math.min(1,10/Math.max(1,headcount()))+OFFICES[s.office].morale*0.5+(s.crunch?-4.5:0)+(overCap?-4:0)+(rw<3?-5:rw<6?-2:0)+(g>0.08?2:g<-0.03?-2:0)+(e.opt>0?0.6:0)+(headcount()+1>adminCap()?-2:0)+rnd(-3,3)+(s.F.energy<25?-1.5:0);
    e.morale=clamp(e.morale+d,0,100);e.ten++;e.ramp=Math.min(1,e.ramp+0.34);
    const pq=e.cof?(e.morale<25?0.08:0):e.morale<45?(45-e.morale)/45*0.32:0.004;
    if(R()<pq)quits.push(e);
  }
  for(const e of quits){removeEmp(e,'퇴사');note(`${ROLES[e.role].name} ${e.name}(${LV[e.lv]}) 퇴사. 사기 ${Math.round(e.morale)}.`,'bad')}
  if(s.crunch)s.crunchM++;else s.crunchM=0;
  // ---- 창업자 ----
  const work=allocTotal()-A.rest;
  let dE=27-4.9*work+9*A.rest-(rw<3?6:0)-(s.crunch?3:0)-(headcount()+1>adminCap()?3:0)-(s.F.salary<2e6&&m>12?2:0)-(s.flags.personalDebt?2:0);
  if(s.flags.forcedRest){dE+=30;s.flags.forcedRest=0}
  F.energy=clamp(F.energy+dE,0,100);
  if(F.energy<=0){s.erVisits++;note(`대표 과로로 응급실행. 다음 달 업무 능력 급감. (${s.erVisits}/3회)`,'bad');s.flags.forcedRest=1;F.energy=15;if(s.erVisits>=3){endGame('burnout');}}
  // ---- 투자 라운드 ----
  if(s.fund)fundTick(A,note);
  // ---- 정부지원 ----
  govTick(A,note,m);
  if(s.ipo)ipoTick(note);
  // ---- 거시경제 ----
  if(R()<0.08)s.ctrend=rnd(-0.03,0.03);
  s.climate=clamp(s.climate+s.ctrend+rnd(-0.02,0.02)+(1-s.climate)*0.03,0.55,1.35);
  s.comp=clamp(s.comp*0.93+(s.pmf>55&&s.users>I.tam*0.01?0.03:0),0,1.2);
  if(s.flags.cogsShock&&--s.flags.cogsShock<=0)delete s.flags.cogsShock;
  if(s.flags.poc&&--s.flags.poc<=0){delete s.flags.poc;if(R()<0.45){const amt=rnd(0.8e7,1.6e7);s.extra.push({amt,left:24});note(`대기업 PoC 성공! 본계약 체결: 월 ${won(amt)} × 24개월.`,'good');s.brand+=6}else note('PoC 종료. 예산 문제로 본계약은 무산.','bad')}
  // ---- 기록 ----
  const fixed=pay+ins+rent+tools+misc+acct;
  const rec={m,rev,net,cash:s.cash,users:s.users,newU,churned,churnR,paid,organic,sales,effCAC,team:headcount(),quality:s.quality,pmf:s.pmf,val:fairVal(),
    lines:{rev,extraRev,cogs,ship,pg,store,pay,ins,ret,rent,server,tools,misc,acct,ad,brandAd,interest,principal,grant,vatPay,corpTax,ipoCost},
    paying,orders,gmv,liq,supply:s.supply,prevUsers,fixed,devPow};
  s.last=rec;s.hist.push({m,rev,cash:s.cash,users:s.users,net,val:rec.val,pmf:s.pmf,quality:s.quality});
  s.month++;
  // ---- 이벤트 ----
  s.pending=[];
  if(calM(s.month)===3&&s.team.some(e=>!e.cof))s.pending.push(EV_RAISE());
  rollEvents();
  if(s.cash<0)s.pending.push(EV_CRISIS());
  if(s.month>=120&&!s.ended)s.pending.push(EV_TIMEOUT());
  genCands();
  return {rec,notes};
}
function removeEmp(e,why){
  s.team=s.team.filter(x=>x!==e);
  if(e.ten>=12&&e.salary>0){const sev=e.salary/12*e.ten/12;s.cash-=sev;s.retire=Math.max(0,s.retire-sev);if(why)addLog(`${e.name} 퇴직금 ${won(sev)} 지급.`)}
  if(e.opt&&e.ten<12){s.esopFree+=e.opt}
  if(e.role==='dev'&&e.skill>65)s.debt=clamp(s.debt+4,0,100);
  for(const o of s.team)o.morale-=3;
  if(e.cof){const c=s.cap.find(x=>x.t==='cof');if(c){const vested=s.vest?(e.ten<12?0:Math.min(1,e.ten/48)):1;const back=c.pct*(1-vested);c.t='dead';c.n='전 공동창업자 '+e.name;c.pct-=back;const me=s.cap.find(x=>x.t==='me');me.pct+=back;addLog(s.vest?`공동창업자 이탈. 베스팅 ${pc(vested,0)}만 인정 → 미베스팅 지분 ${pc(back)} 회수.`:`공동창업자 이탈. 베스팅 조항이 없어 지분 ${pc(c.pct)}을 그대로 보유한 채 떠남(데드 에쿼티).`)}}
}
function fireEmp(e){
  const notice=e.salary/12;s.cash-=notice;addLog(`${ROLES[e.role].name} ${e.name} 권고사직. 해고예고수당 ${won(notice)} 지급.`);
  removeEmp(e,'해고');for(const o of s.team)o.morale-=4;
}

/* ============ 투자 ============ */
function startRound(i){const r=ROUNDS[i];s.fund={i,prog:0,months:0,offers:null,dd:0,chosen:null,msg:''};addLog(`${r.name} 라운드 시작. 목표 ${won(r.amt[0])}~${won(r.amt[1])}.`)}
function attract(i){let a=fairVal()/ROUNDS[i].th;if(i>=1&&s.pmf<30)a*=0.7;if(i>=3&&growth()<0.04)a*=0.75;if(deadEquity()>0.12)a*=0.8;return a}
function fundTick(A,note){
  const f=s.fund,r=ROUNDS[f.i];
  if(f.dd>0){f.dd--;if(f.dd===0){
      const fail=0.07+(s.climate<0.8?0.12:0)+(s.debt>70?0.05:0)+(s.pmf<25?0.05:0);
      if(R()<fail){note(`${f.chosen.vc} 투자심의위원회 부결. ${r.name} 라운드 무산.`,'bad');s.fund=null;s.brand-=3}
      else closeRound(f,note)}return}
  if(f.offers)return;
  f.months++;
  const a=attract(f.i);
  const inc=A.ir*(4+s.F.network/12)*Math.pow(clamp(a,0,2),1.3)*s.climate+(investorsIn().length?2.5:0);
  f.prog=Math.min(a<0.5?55:999,f.prog+inc);
  const msgs=a<0.5?['"아직 초기네요. 지표가 더 쌓이면 다시 보시죠."','"리텐션 커브가 평평해지는 걸 보고 싶습니다."','"시장 크기에 대한 확신이 없어요."','"팀 구성이 더 갖춰지면 연락 주세요."']:a<1?['"관심 있습니다. 파트너 미팅 잡아보죠."','"레퍼런스 체크를 해보겠습니다."','"밸류에이션이 좀 높은 것 같은데요."']:['"다음 주에 IC 올리겠습니다."','"리드로 들어가고 싶습니다."','"경쟁 VC가 붙었다고 들었어요."'];
  f.msg=pick(msgs);
  if(A.ir===0)f.msg='이번 달 IR 미팅이 없어 진행이 멈췄습니다.';
  if(f.prog>=100){
    const n=1+(a>1.3?1:0)+(a>1.8?1:0);f.offers=[];
    const used=new Set();
    for(let k=0;k<n;k++){let vc;do{vc=pick(VCS)}while(used.has(vc));used.add(vc);
      const pre=fairVal()*rnd(0.78,1.08)*(n>1?1.06:1);const d=rnd(r.dil[0],r.dil[1]);const amt=clamp(pre*d/(1-d),r.amt[0],r.amt[1]);
      f.offers.push({vc,pre,amt,dil:amt/(pre+amt),tips:f.i<=1&&R()<0.55});}
    note(`${r.name}: 텀시트 ${n}건 도착!`,'good');
  }else if(f.months>=7){note(`${r.name} 라운드 7개월째 리드 투자자 확보 실패. 라운드 종료.`,'bad');s.fund=null;s.brand-=2}
}
function closeRound(f,note){
  const r=ROUNDS[f.i],o=f.chosen;
  if(f.i>=1&&!s.cap.find(c=>c.t==='esop'))ensureEsop();
  dilute(o.dil,{n:o.vc+' ('+r.name+')',t:'inv',inv:o.amt});
  s.cash+=o.amt;s.rounds.push({k:r.k,name:r.name,vc:o.vc,pre:o.pre,amt:o.amt,m:s.month});
  if(o.tips)s.tipsOK=true;
  s.brand+=4+f.i*2;
  note(`${r.name} 클로징: ${o.vc}로부터 ${won(o.amt)} 투자 유치 (프리머니 ${won(o.pre)}). 대표 지분 ${pc(myPct())}.`,'good');
  s.fund=null;
}
function acceptOffer(k){const f=s.fund,r=ROUNDS[f.i];f.chosen=f.offers[k];f.offers=null;f.dd=r.dd;addLog(`${f.chosen.vc} 텀시트 서명. 실사(Due Diligence) ${r.dd}개월 진행.`)}

/* ============ 정부지원·대출 ============ */

    else{G.tips='none';note('TIPS 대면평가 탈락. 재신청 가능.','bad')}}

      if(R()<p){const amt=Math.round(Math.min(3e8,1e8+lastRev()*12*0.25)/1e6)*1e6;s.loan={orig:amt,bal:amt,rate:0.048,grace:12};s.cash+=amt;G.kibo='done';note(`기술보증기금 보증서 발급, 은행 대출 ${won(amt)} 실행 (연 4.8%, 거치 1년 후 3년 분할상환).`,'good')}
      else{G.kibo='none';note('기술보증기금 기술평가 미달로 보증 거절.','bad')}}
    else{G.kibo='none';note('보증 심사 서류 미제출 (지원사업·행정 1칸 필요).','bad')}}
  if(G.center==='apply'){if(R()<0.55){G.center='done';s.office='center';note('창업지원센터 입주 심사 합격. 사무실 이전.','good')}else{G.center='none';note('창업지원센터 입주 심사 탈락.','bad')}}
}
function ipoTick(note){const p=s.ipo;p.left--;if(p.left===0){
  const ok=clamp(0.45+s.pmf/250+(growth()>0.03?0.1:0)+(lastRev()*12>1e10?0.1:0)-(s.climate<0.85?0.15:0),0.15,0.9);

function EV_RAISE(){const avg=s.team.filter(e=>!e.cof).reduce((a,e)=>a+e.salary,0);
  const mk=(pctv,mor,t)=>({t,d:`인건비 연 ${won(avg*pctv)} 증가 · 팀 사기 ${sgn(mor)}${mor}`,f:()=>{for(const e of s.team)if(!e.cof){e.salary*=1+pctv;e.morale=clamp(e.morale+mor+(pctv<0.03&&e.lv>=2?-4:0),0,100)}return `연봉 ${pc(pctv,0)} 인상 확정.`}});
  return {eb:'3월 · 연봉 협상 시즌',title:'올해 연봉 인상률을 정해야 합니다',body:`직원 ${s.team.filter(e=>!e.cof).length}명, 현재 연봉 총액 ${won(avg)}. 업계 평균 인상률은 6~8%입니다. 동결하면 시니어부터 이직 시장을 기웃거립니다.`,
    choices:[mk(0,-12,'동결 (0%)'),mk(0.03,-3,'물가 수준 (3%)'),mk(0.07,2,'업계 평균 (7%)'),mk(0.12,8,'공격적 (12%)')]}}
function EV_CRISIS(){
  const ch=[];const need=-s.cash;

  if(investorsIn().length&&!(s.flags.bridgeAt>s.month-8))ch.push({t:'기존 투자자에게 브릿지 투자(CB) 요청',d:'성공 확률은 투자심리에 좌우. 성공 시 3~4개월치 운영자금, 30% 할인된 가치로 희석',f:()=>{s.flags.bridgeAt=s.month;if(R()<0.35+0.3*s.climate+s.pmf/400){const amt=Math.max(need+burn()*3.5,1e8);const pre=fairVal()*0.7;dilute(amt/(pre+amt),{n:investorsIn()[0].n.replace(/ \(.+\)/,'')+' (브릿지 CB)',t:'inv',inv:amt});s.cash+=amt;return `브릿지 ${won(amt)} 확보. 다음 라운드까지 버틸 시간을 벌었습니다.`}return '투자자들이 추가 투자를 거절했습니다. "다른 방법을 찾아보세요."'}});
  if(s.team.length>=2)ch.push({t:'인수 제안처 물색 (애크하이어)',d:'팀과 기술을 헐값에 넘기고 회사를 정리합니다',f:()=>{const price=Math.max(0,s.team.length*rnd(0.5,1.2)*1e8+s.quality*5e6);endGame('acquihire',price);return ''}});

}

    {t:'거절하고 계속 키운다',d:'',f:()=>{s.flags.maAt=s.month;return '"우리는 더 큰 회사가 될 겁니다."'}}]}}},
];
function rollEvents(){
  const n=R()<0.62?(R()<0.2?2:1):0;const used=new Set();
  for(let k=0;k<n;k++){const pool=EVENTS.map((e,i)=>({i,w:used.has(i)?0:Math.max(0,e.w())}));const tot=pool.reduce((a,b)=>a+b.w,0);if(tot<=0)break;let x=R()*tot;const c=pool.find(p=>(x-=p.w)<=0);if(!c)break;used.add(c.i);s.pending.push(EVENTS[c.i].mk())}
}
function waterfall(price){
  // 비참가적 1x 청산우선권: 투자자는 (투자원금) vs (전환 후 지분가치) 중 큰 쪽
  let left=price;const out={me:0};const inv=s.cap.filter(c=>c.t==='inv');
  let convPct=0,prefPaid=0;
  const prefs=inv.filter(c=>c.inv>c.pct*price);
  for(const c of prefs){const p=Math.min(c.inv,left);left-=p;prefPaid+=p}
  const common=s.cap.filter(c=>!prefs.includes(c));convPct=common.reduce((a,c)=>a+c.pct,0);
  const me=s.cap.find(c=>c.t==='me');out.me=convPct>0&&me?left*me.pct/convPct:0;out.pref=prefPaid;return out;
}

/* ============ 엔딩 ============ */
function endGame(kind,value=0,who=''){
  if(s.ended)return;
  let wealth=0,title='',body='';
  const mp=myPct();
  if(kind==='ipo'){wealth=value*mp;title='코스닥 상장';body=`공모가 기준 시가총액 ${won(value)}. 대표 지분 ${pc(mp)}의 평가가치 ${won(wealth)}. 상장 후 보호예수 기간 동안 주식을 팔 수 없습니다.`}
  else if(kind==='acquired'){wealth=waterfall(value).me;title='엑싯: 회사 매각';body=`${who}에 ${won(value)}에 매각. 투자자 청산우선권 반영 후 대표 몫 ${won(wealth)} (양도소득세 전).`}
  else if(kind==='acquihire'){wealth=waterfall(value).me;title='애크하이어';body=`팀과 기술을 ${won(value)}에 넘기고 회사를 정리했습니다. 대표 몫 ${won(wealth)}. 다음 창업을 위한 경험은 남았습니다.`}
  else if(kind==='bankrupt'){wealth=-(s.flags.personalDebt?5e7:0);title='폐업';body=`${s.month}개월 만에 문을 닫았습니다. 국내 스타트업의 5년 생존율은 약 33%입니다. 남은 것은 경험과${s.flags.personalDebt?' 개인 부채':' 교훈'}입니다.`}
  else if(kind==='burnout'){wealth=fairVal()*mp*0.2;title='번아웃';body='세 번째 응급실 이후 의사는 경영 일선에서 물러날 것을 강력히 권했습니다. 전문경영인을 선임하고 이사회에서 물러납니다.'}
  else if(kind==='timeout'){wealth=value*mp;title='10년 결산';body=`기업가치 ${won(value)}, 대표 지분 ${pc(mp)}. 지분가치 ${won(wealth)}.`}
  else if(kind==='quit'){wealth=0;title='자진 청산';body='대표가 사업을 접기로 했습니다.'}
  const grade=wealth>=1e11?'S':wealth>=1e10?'A':wealth>=1e9?'B':wealth>0?'C':'F';
  s.ended={kind,wealth,title,body,grade,m:s.month,unicorn:s.hist.some(h=>h.val>=1e12)};
  clearSave();
}

function meter(label,v,max=100,cls='',right){return `<div class="meter"><div class="row between"><span>${label}</span><span class="mono">${right??Math.round(v)}</span></div><div class="bar ${cls}"><i style="width:${clamp(v/max*100,0,100)}%"></i></div></div>`}
function chart(series,{h=210,fmt=won}={}){
  const H=s.hist;if(H.length<2)return `<p class="muted note">다음 달부터 추이가 그려집니다.</p>`;
  const W=600,P={l:66,r:30,t:12,b:26};const n=H.length;
  let mn=Infinity,mx=-Infinity;series.forEach(se=>H.forEach(h=>{const v=se.get(h);mn=Math.min(mn,v);mx=Math.max(mx,v)}));
  mn=Math.min(0,mn);if(mx===mn)mx=mn+1;
  const x=i=>P.l+(W-P.l-P.r)*i/(n-1),y=v=>P.t+(h-P.t-P.b)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end" font-size="12.5" style="fill:var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(v)}</text>`}
  if(mn<0)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>`;
  const step=Math.max(1,Math.ceil(n/6));for(let i=0;i<n-step/2;i+=step)g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="12.5" style="fill:var(--muted)" font-family="IBM Plex Mono,monospace">${ym(H[i].m)}</text>`;
  const lines=series.map(se=>{const pts=H.map((hh,i)=>`${x(i).toFixed(1)},${y(se.get(hh)).toFixed(1)}`);const last=H[n-1];
    return (se.area?`<polygon points="${x(0)},${y(Math.max(mn,0))} ${pts.join(' ')} ${x(n-1)},${y(Math.max(mn,0))}" style="fill:${se.c}" opacity=".12"/>`:'')+`<polyline points="${pts.join(' ')}" fill="none" style="stroke:${se.c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(se.get(last))}" r="3.5" style="fill:${se.c}"/>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img">${g}${lines}</svg><div class="legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}</div></div>`}

function unitEcon(){
  const I=ind(),L=s.last;if(!L||s.users<1)return null;
  let arpu=0,gm=1;
  if(s.ind==='saas'){arpu=s.price;gm=0.85}
  else if(s.ind==='app'){arpu=L.rev/Math.max(1,s.users);gm=1-I.storeFee-0.05}
  else if(s.ind==='commerce'){arpu=L.rev/Math.max(1,s.users);gm=1-(L.lines.cogs+L.lines.ship+L.lines.pg)/Math.max(1,L.lines.rev)}
  else{arpu=L.rev/Math.max(1,s.users);gm=1-L.lines.pg/Math.max(1,L.lines.rev)}
  const ltv=arpu*gm/Math.max(0.01,L.churnR);
  const blended=(L.lines.ad+L.lines.brandAd+payroll()*0.15)/Math.max(1,L.newU);
  return {arpu,gm,ltv,cac:L.paid>0?L.effCAC:blended,ratio:ltv/Math.max(1,L.paid>0?L.effCAC:blended),payback:(L.paid>0?L.effCAC:blended)/Math.max(1,arpu*gm)};
}

     <p class="note">오퍼 버튼 옆 숫자는 예상 수락 확률. 후보자는 다음 달이면 다른 회사로 갑니다. '채용·면접'에 시간을 쓰면 후보자가 늘어납니다. 입사자는 3개월간 온보딩합니다.</p>
     ${s.cands.length?`<div class="grid2">${cands}</div>`:'<p class="muted">지원자가 없습니다. 채용 활동에 시간을 쓰세요.</p>'}

function tFin(){

    <tr class="sub"><td>매출총이익</td><td class="r mono">${won(l.rev-cogsT)}</td></tr>
    ${r('급여',-l.pay)}${r('4대보험 사업주분 (10.5%)',-l.ins)}${r('퇴직급여 충당 (8.33%)',-l.ret)}
    ${r('임차료',-l.rent)}${r('서버·클라우드',-l.server)}${r('SW 구독·장비',-l.tools)}${r('복리후생·통신·소모품',-l.misc)}${r('세무기장·법무',-l.acct)}
    ${r('퍼포먼스 광고',-l.ad)}${r('브랜드 마케팅',-l.brandAd)}${r('상장 준비 비용',-l.ipoCost)}
    <tr class="sub"><td>영업이익</td><td class="r mono ${ebitda<0?'bad':'good'}">${won(ebitda)}</td></tr>
    ${r('이자비용',-l.interest)}${r('대출 원금상환',-l.principal)}${r('정부지원금 입금',l.grant)}${r('부가세 납부(환급)',-l.vatPay)}${r('법인세',-l.corpTax)}
    ${r('퇴직충당 (비현금, 가산)',l.ret)}
    <tr class="sum"><td>순현금흐름</td><td class="r mono">${won(L.net)}</td></tr>
   </tbody></table></div></div>
   <div style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>재무상태 요약</h2><table><tbody>
      <tr><td>현금</td><td class="r mono">${won(s.cash)}</td></tr>
      <tr><td>임차보증금</td><td class="r mono">${won(s.deposit)}</td></tr>
      <tr><td>차입금</td><td class="r mono">${won(s.loan?s.loan.bal:0)}</td></tr>
      <tr><td>퇴직급여충당부채</td><td class="r mono">${won(s.retire)}</td></tr>
      <tr><td>이월결손금</td><td class="r mono">${won(s.loss)}</td></tr>
      <tr><td>최근 12개월 매출</td><td class="r mono">${won(ttm)}</td></tr>
      <tr><td>누적 투자유치</td><td class="r mono">${won(s.rounds.reduce((a,r)=>a+r.amt,0))}</td></tr>
    </tbody></table></div>
    <div class="panel"><h2>세무 일정</h2><table><tbody>
      <tr><td>부가세 (1·4·7·10월)</td><td class="r mono">당분기 예상 ${won(s.vat.out-s.vat.in)}</td></tr>
      <tr><td>법인세 (3월)</td><td class="r mono">${calY(s.month)}년 누적손익 ${won(s.yp[calY(s.month)]||0)}</td></tr>
    </tbody></table><p class="note">법인세율 9%(2억 이하)·19%·21% + 지방소득세 10%. 창업 5년간 창업중소기업 세액감면 50% 적용. 결손금은 이월 공제됩니다.</p></div>
   </div></div>`}

function tInv(){
  const f=s.fund,si=stageIdx(),fv=fairVal();

      <button class="btn primary" data-accept="${k}">서명</button></div>`).join('')}</div><button class="btn sm" data-act="rejectAll">모두 거절</button>`;
    else{const a=attract(f.i);fund=`<div class="row between"><b>${r.name} 진행 중 · ${f.months}개월째</b><span class="chip ${a>=1?'good':a<0.5?'bad':'warn'}">투자 매력도 ${pc(a,0)}</span></div>${meter('리드 투자자 확보',f.prog,100,'',Math.round(f.prog)+'%')}<p class="note">${esc(f.msg||'투자자 미팅(IR)에 시간을 배정하세요.')}</p><button class="btn sm danger" data-act="abort">라운드 중단</button>`}

  const G=s.gov,cal=calM(s.month);
  const chogiOpen=(cal===2||cal===3)&&s.month<36&&(G.chogi==='none'||G.chogi==='fail');
  const gov=`<table><tbody>
   <tr><td><b>초기창업패키지</b><div class="note">업력 3년 이내, 최대 1억 사업화자금. 매년 2~3월 공고.</div></td><td class="r">${G.chogi==='done'?'<span class="chip good">선정</span>':G.chogi==='review'?'<span class="chip">심사 중</span>':G.chogi==='apply'?'<span class="chip">이번 달 제출</span>':chogiOpen?'<button class="btn sm" data-gov="chogi">신청</button>':s.month>=36?'<span class="chip">업력 초과</span>':'<span class="note">공고 대기</span>'}</td></tr>
   <tr><td><b>TIPS</b><div class="note">운영사 투자 유치 기업 대상. R&D 5억원 / 2년, 비희석.</div></td><td class="r">${G.tips==='done'?'<span class="chip good">선정</span>':G.tips==='review'?'<span class="chip">심사 중</span>':G.tips==='apply'?'<span class="chip">이번 달 제출</span>':s.tipsOK?'<button class="btn sm" data-gov="tips">신청</button>':'<span class="note">운영사 투자 필요</span>'}</td></tr>
   <tr><td><b>기술보증기금 보증대출</b><div class="note">최대 3억, 연 4.8%, 1년 거치 3년 분할상환. 업력 6개월·완성도 30 이상.</div></td><td class="r">${s.loan?'<span class="chip">대출 중</span>':G.kibo==='apply'?'<span class="chip">이번 달 심사</span>':s.month>=6&&s.quality>=30?'<button class="btn sm" data-gov="kibo">신청</button>':'<span class="note">조건 미달</span>'}</td></tr>
  </tbody></table><p class="note">신청한 달에 '지원사업·행정' 시간을 배정해야 접수됩니다 (TIPS·초창패 2칸, 기보 1칸).</p>`;
  const canIPO=!s.ipo&&s.month>=36&&(s.hist.slice(-12).reduce((a,h)=>a+h.rev,0)>=1e10||fv>=2e11)&&s.pmf>=50&&!(s.flags.ipoRetry>s.month);
  return `<div style="display:flex;flex-direction:column;gap:14px">
   <div class="panel"><h2>투자 라운드</h2>${fund}</div>

   <div class="panel"><h2>상장 (IPO)</h2>${s.ipo?`<p>상장 준비 중 · 거래소 심사까지 ${s.ipo.left}개월. 지정감사, 내부통제 구축, 주관사 수수료로 월 3,500만원 지출.</p>`:`<p class="note">기술특례 코스닥 상장 요건(게임 기준): 업력 3년 이상, 최근 12개월 매출 100억 이상 또는 기업가치 2,000억 이상, PMF 50 이상.</p>${canIPO?'<button class="btn primary" data-act="ipo">상장 준비 착수 (9개월)</button>':'<button class="btn" disabled>요건 미충족</button>'}`}</div>
   ${s.rounds.length?`<div class="panel"><h2>투자 이력</h2><table><thead><tr><th>시점</th><th>라운드</th><th>투자자</th><th class="r">금액</th><th class="r">프리머니</th></tr></thead><tbody>${s.rounds.map(r=>`<tr><td class="mono">${ym(r.m)}</td><td>${r.name}</td><td>${esc(r.vc)}</td><td class="r mono">${won(r.amt)}</td><td class="r mono">${won(r.pre)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div>`}

  return `<div class="panel">
   <div class="row between"><h2>이번 달 시간표</h2><span class="mono">${used}/${av}</span></div>

   ${av<8?`<p class="note warn">${s.flags.forcedRest?'휴식 중: 3칸만 사용 가능':F.energy<20?'체력 부족으로 시간 감소':'조직 관리 부담으로 시간 감소'}</p>`:''}
   <div>${ACTS.map(a=>`<div class="act"><span class="n">${a.n}</span><span class="d">${a.d}${a.k==='dev'?` (개발역량 ${F.dev})`:a.k==='sales'?` (영업역량 ${F.sales})`:a.k==='ir'?` (네트워크 ${F.network})`:''}</span>
     <div class="stepper"><button data-dec="${a.k}" aria-label="${a.n} 줄이기">−</button><b>${A[a.k]}</b><button data-inc="${a.k}" aria-label="${a.n} 늘리기">+</button></div></div>`).join('')}</div>

   <button class="btn primary" data-act="next" style="padding:12px">${calM(s.month)}월 마감하고 다음 달로 →</button>

  </div>`}

function renderSetup(){
  const S=ui.setup,saved=load();
  const opt=(group,k,v,extra='')=>`<button class="opt" data-set="${group}" data-v="${k}" aria-pressed="${S[group]===k}"><b>${v.name}</b><span>${v.desc||v.note}</span>${extra}</button>`;
  app.innerHTML=`<div class="setup">
   <div class="hero"><span class="muted" style="letter-spacing:.1em;font-size:12px">한국 스타트업 경영 시뮬레이션</span><h1>스타트업 생존기</h1>
    <p>법인 설립부터 상장까지. 월 단위로 시간을 배분하고, 사람을 뽑고, 돈을 구하세요. 4대보험, 부가세, 법인세, 퇴직금, 청산우선권, TIPS, 기보 대출까지 현실의 규칙이 그대로 적용됩니다. 대부분의 회사는 3년을 넘기지 못합니다.</p></div>
   ${saved&&!saved.ended?`<div class="callout good row between"><span>저장된 게임: <b>${esc(saved.co)}</b> · 업력 ${saved.month}개월 · 현금 ${won(saved.cash)}</span><button class="btn primary" data-act="continue">이어하기</button></div>`:''}
   <div class="grid2"><div class="field"><label for="fname">대표 이름</label><input type="text" id="fname" value="${esc(S.name)}" placeholder="홍길동" maxlength="12"></div>
   <div class="field"><label for="coname">회사명</label><input type="text" id="coname" value="${esc(S.co)}" placeholder="주식회사 새싹랩" maxlength="20"></div></div>
   <div class="field"><label>사업 아이템</label><div class="opts">${Object.entries(IND).map(([k,v])=>`<button class="opt" data-set="ind" data-v="${k}" aria-pressed="${S.ind===k}"><b>${v.name}</b><em>${v.ex}</em><span>${v.note}</span></button>`).join('')}</div></div>
   <div class="field"><label>창업자 배경</label><div class="opts">${Object.entries(BG).map(([k,v])=>opt('bg',k,v,`<em>자본 ${won(v.cap)} · 개발 ${v.dev} · 영업 ${v.sales} · 인맥 ${v.network}</em>`)).join('')}</div></div>
   <div class="field"><label>공동창업자</label><div class="opts">${Object.entries(COF).map(([k,v])=>opt('cof',k,v)).join('')}</div>
    <label class="row note"><input type="checkbox" id="vest" ${S.vest?'checked':''}> 주주간계약에 4년 베스팅(1년 클리프) 조항 넣기</label></div>
   <p class="note">아이템의 PMF 잠재력은 무작위이며 숨겨져 있습니다. 고객 인터뷰로 확인하세요.</p>
   <button class="btn primary" data-act="start" style="padding:14px;font-size:16px">법인 설립하기</button>
  </div>`}
function renderEnd(){
  const E=s.ended,H=s.hist,peak=Math.max(0,...H.map(h=>h.val));
  app.innerHTML=`<div class="setup ending"><div class="hero"><span class="muted">${esc(s.co)} · ${E.m}개월</span><h1>${E.title}</h1><p>${E.body}</p></div>
   <div class="kpis">
    <div class="kpi"><div class="l">등급</div><div class="v">${E.grade}</div></div>
    <div class="kpi"><div class="l">대표 최종 자산가치</div><div class="v">${won(E.wealth)}</div></div>
    <div class="kpi"><div class="l">최고 기업가치</div><div class="v">${won(peak)}</div><div class="s">${E.unicorn?'유니콘 달성':''}</div></div>
    <div class="kpi"><div class="l">최대 월매출</div><div class="v">${won(Math.max(0,...H.map(h=>h.rev)))}</div></div>
    <div class="kpi"><div class="l">누적 투자유치</div><div class="v">${won(s.rounds.reduce((a,r)=>a+r.amt,0))}</div></div>
    <div class="kpi"><div class="l">최종 대표 지분</div><div class="v">${pc(myPct())}</div></div>
   </div>
   <div class="panel"><h3>매출 · 현금 추이</h3>${chart([{n:'현금',c:'var(--info)',get:h=>h.cash},{n:'월 매출',c:'var(--accent)',get:h=>h.rev,area:true}])}</div>
   <div class="panel"><h3>연대기</h3><div class="log">${s.log.slice(0,80).map(l=>`<div><span>${ym(l.m)}</span><span>${esc(l.t)}</span></div>`).join('')}</div></div>
   <button class="btn primary" data-act="restart" style="padding:14px">다시 창업하기</button></div>`}

/* ============ 모달 ============ */
let queue=[];
function showReport(res){
  const L=res.rec;
  const items=res.notes.map(n=>`<li class="${n.c||''}">${esc(n.t)}</li>`).join('');
  queue.push({report:true,html:`<span class="eyebrow">${ym(L.m)} 월간 결산</span><h2>${calY(L.m)}년 ${calM(L.m)}월 마감</h2>
   <div class="grid3">
    <div><div class="note">매출</div><div class="mono" style="font-size:18px">${won(L.rev)}</div></div>
    <div><div class="note">순현금흐름</div><div class="mono ${L.net<0?'bad':'good'}" style="font-size:18px">${L.net>=0?'+':''}${won(L.net)}</div></div>
    <div><div class="note">현금 잔고</div><div class="mono" style="font-size:18px">${won(s.cash)}</div></div>
    <div><div class="note">${ind().unit}</div><div class="mono" style="font-size:18px">${num(s.users)} <span class="note good">+${num(L.newU)}</span></div></div>
    <div><div class="note">제품 완성도</div><div class="mono" style="font-size:18px">${Math.round(s.quality)}</div></div>
    <div><div class="note">대표 체력</div><div class="mono ${s.F.energy<30?'bad':''}" style="font-size:18px">${Math.round(s.F.energy)}</div></div>
   </div>${items?`<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${items}</ul>`:'<p class="muted">특별한 일 없이 지나간 한 달.</p>'}`});
  for(const ev of s.pending)queue.push({ev});
  s.pending=[];
  nextModal();
}
function nextModal(){
  if(s&&s.ended){queue=[];modal.hidden=true;render();return}
  const q=queue.shift();
  if(!q){modal.hidden=true;if(s&&!s.ended)save();render();return}
  modal.hidden=false;
  if(q.report){sheet.innerHTML=q.html+`<button class="btn primary" data-m="ok">확인</button>`}
  else{const ev=q.ev;sheet.innerHTML=`<span class="eyebrow">${esc(ev.eb)}</span><h2>${esc(ev.title)}</h2><p>${esc(ev.body)}</p><div class="choices">${ev.choices.map((c,i)=>`<button class="choice" data-c="${i}"><b>${esc(c.t)}</b>${c.d?`<small>${esc(c.d)}</small>`:''}</button>`).join('')}</div>`;sheet._ev=ev}
  sheet._q=q;const b=sheet.querySelector('button');if(b)b.focus({preventScroll:true});
}
sheet.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.m==='ok'){nextModal();return}
  if(t.dataset.res==='ok'){const ev=sheet._ev;if(ev&&ev.crisis&&s.cash<0&&!s.ended){queue.unshift({ev:EV_CRISIS()})}nextModal();return}
  if(t.dataset.c!=null){const ev=sheet._ev,c=ev.choices[+t.dataset.c];const msg=c.f();sanitize();
    if(s.ended){nextModal();return}
    if(msg)addLog(`${ev.title} → ${msg}`,s.month-1);
    sheet.innerHTML=`<span class="eyebrow">${esc(ev.eb)}</span><h2>${esc(c.t)}</h2><p>${esc(msg||'결정했습니다.')}</p><button class="btn primary" data-res="ok">계속</button>`;sheet.querySelector('button').focus({preventScroll:true})}
});
function sanitize(){s.brand=clamp(s.brand,0,100);s.F.energy=clamp(s.F.energy,0,100);s.users=Math.max(0,s.users);s.debt=clamp(s.debt,0,100);s.pmf=clamp(s.pmf,0,100);for(const e of s.team)e.morale=clamp(e.morale,0,100)}

/* ============ 입력 ============ */
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.set){ui.setup[d.set]=d.v;render();return}
  if(d.tab){ui.tab=d.tab;ui.confirm=null;render();return}
  if(d.inc){if(allocTotal()<blocksAvail()){s.alloc[d.inc]++;render()}return}
  if(d.dec){if(s.alloc[d.dec]>0){s.alloc[d.dec]--;render()}return}
  if(d.focus){s.focus=d.focus;render();return}
  if(d.firec){ui.confirm='fire'+d.firec;render();return}
  if(d.fire){const emp=s.team.find(x=>x.id==d.fire);if(emp)fireEmp(emp);ui.confirm=null;sanitize();render();return}
  if(d.offer){const c=s.cands.find(x=>x.id==d.offer);if(!c)return;const mult=+d.m,opt=!!d.o;const p=offerChance(c,mult,opt);
    s.cands=s.cands.filter(x=>x!==c);
    if(R()<p){let g=0;if(opt){ensureEsop();g=Math.min(optGrant(c.lv),s.esopFree);s.esopFree-=g}
      s.team.push({id:c.id,name:c.name,role:c.role,lv:c.lv,skill:c.skill,salary:Math.round(c.ask*mult),morale:70+(opt?6:0),ten:0,ramp:0,opt:g});
      addLog(`${ROLES[c.role].name} ${c.name}(${LV[c.lv]}, 역량 ${c.skill}) 입사 확정. 연봉 ${won(c.ask*mult)}${g?`, 스톡옵션 ${pc(g,2)}`:''}.`);toast(`${c.name} 님이 오퍼를 수락했습니다.`,'good')}
    else{addLog(`${c.name}(${ROLES[c.role].name}) 오퍼 거절.`);toast(`${c.name} 님이 오퍼를 거절했습니다.`,'bad')}
    render();return}
  if(d.round){startRound(+d.round);render();return}
  if(d.accept){acceptOffer(+d.accept);render();return}
  if(d.gov){if(d.gov==='chogi')s.gov.chogi='apply';if(d.gov==='tips')s.gov.tips='apply';if(d.gov==='kibo')s.gov.kibo='apply';toast('신청 예약. 이번 달 "지원사업·행정"에 시간을 배정하세요.');render();return}
  const a=d.act;
  if(a==='start'){const S=ui.setup;S.name=(document.getElementById('fname').value||'').trim();S.co=(document.getElementById('coname').value||'').trim();S.vest=document.getElementById('vest').checked;newGame(S);ui.tab='dash';render();window.scrollTo(0,0);return}
  if(a==='continue'){s=load();render();return}
  if(a==='restart'){s=null;render();window.scrollTo(0,0);return}
  if(a==='next'){ui.confirm=null;const res=simulate();sanitize();if(!s.ended)save();showReport(res);return}
  if(a==='move'){const k=document.getElementById('office').value;if(k===s.office)return;const o=OFFICES[k];
    if(o.apply){s.gov.center='apply';toast('입주 신청서를 냈습니다. 다음 달 결과가 나옵니다.');render();return}
    s.cash+=s.deposit;s.deposit=o.deposit;s.cash-=o.deposit+o.move;s.office=k;addLog(`${o.name}(으)로 이전. 보증금 ${won(o.deposit)}, 이전·인테리어 ${won(o.move)}.`);render();return}
  if(a==='pivot'){ui.confirm='pivot';render();return}
  if(a==='pivotYes'){s.pivots++;s.quality*=0.4;s.users*=0.25;s.pmf*=0.3;s.fit=clamp(rnd(0.4,1)+0.04*s.pivots,0.3,1);s.debt*=0.6;ui.confirm=null;s.team.forEach(e=>e.morale-=6);addLog(`피벗 #${s.pivots}. 기존 가설을 버리고 새 문제를 정의합니다.`);render();return}
  if(a==='cancel'){ui.confirm=null;render();return}
  if(a==='abort'){addLog(`${ROUNDS[s.fund.i].name} 라운드 중단.`);s.fund=null;render();return}
  if(a==='rejectAll'){addLog('받은 텀시트를 모두 거절.');s.fund=null;render();return}
  if(a==='ipo'){s.ipo={left:9};addLog('상장 주관사 선정, 지정감사 신청. 상장 준비 착수.');render();return}
  if(a==='quit'){ui.confirm='quit';render();return}
  if(a==='quitYes'){endGame('quit');render();return}
  if(a==='theme'){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');return}
});
app.addEventListener('input',e=>{
  const t=e.target;if(!s)return;
  if(t.id==='price'){s.price=s.ind==='market'?ind().base*t.value/100:Math.round(ind().base*t.value/100/100)*100;document.getElementById('priceLbl').textContent=s.ind==='market'?pc(s.price,1):won(s.price)}
  if(t.id==='ad'||t.id==='brandAd'){const v=+t.value;const amt=v===0?0:Math.round(Math.pow(10,5+v/100*5.3)/1e5)*1e5;s[t.id]=amt;document.getElementById(t.id==='ad'?'adLbl':'bLbl').textContent=won(amt)}
  if(t.id==='fsal'){s.F.salary=+t.value*1e4;document.getElementById('salLbl').textContent=won(s.F.salary)}
});
app.addEventListener('change',e=>{
  const t=e.target;if(!s)return;
  if(t.id==='crunch'){s.crunch=t.checked;render()}
  if(t.id==='rfocus'){s.recruitFocus=t.value}
  if(['price','ad','brandAd','fsal'].includes(t.id))render();
});
function toast(msg,c=''){const d=document.createElement('div');d.textContent=msg;d.className='chip '+c;d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;padding:8px 14px;font-size:13px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18)';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* 시작 */
function start(data){if(data&&data.s){s=data.s;ui=Object.assign(ui,data.ui||{})}render()}
if(window.claude?.hot){window.claude.hot.snapshot?.(()=>({s,ui}))}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
