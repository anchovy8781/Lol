<title>스타트업 생존기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 한밤의 판교 오피스 위로 떠 있는 한 장의 결정 카드. 세로 한 화면, 위에서부터 게이지 → 질문 → 카드 → 선택지 */
:root{
  --night:#121a30; --night-2:#1b2547; --glass:rgba(30,41,80,.82); --line:rgba(214,222,255,.14);
  --ink:#eef1fa; --muted:#94a0c4; --lamp:#f5b841; --lamp-ink:#2a1d00;
  --good:#5fd8ab; --bad:#ff6f6f; --paper:#f3f5fb; --paper-ink:#1a2036; --paper-mute:#5b6483;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-card:22px; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;display:flex;flex-direction:column;box-sizing:border-box}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-family:var(--display);font-size:19px;letter-spacing:.02em;background:var(--glass);border:1px solid var(--line);transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--lamp);color:var(--lamp-ink);border-color:transparent;box-shadow:0 10px 30px -8px rgba(245,184,65,.55)}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.eyebrow{font-family:var(--num);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- 타이틀 ---------- */
.title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-block:20px}
.logo{font-family:var(--display);font-size:clamp(54px,17vw,84px);line-height:.92;letter-spacing:-.01em;margin:0}
.logo span{color:var(--lamp);display:block}
.tagline{color:var(--muted);font-size:16px;line-height:1.6;margin:0;max-width:30ch}
.fan{position:relative;height:150px;margin-block:4px}
.fan .mini{position:absolute;top:0;width:96px;height:128px;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fan .mini svg{width:100%;height:100%;display:block}
.menu{display:grid;gap:10px}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.records{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.records b{color:var(--ink);font-family:var(--num);font-weight:600}

/* ---------- 창업 설정 ---------- */
.setup{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px;overflow-y:auto}
.setup h2{font-family:var(--display);font-size:30px;margin:0;font-weight:400}
.field{display:grid;gap:8px}
.field label{font-size:13px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:17px;padding:0 14px}
.dice{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:22px}
.inds{display:grid;gap:10px}
.ind{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass)}
.ind[aria-pressed="true"]{border-color:var(--lamp);background:rgba(245,184,65,.12)}
.ind .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--night-2);color:var(--lamp)}
.ind b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.ind small{color:var(--muted);font-size:13px;line-height:1.45}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--glass)}
.chip.lamp{border-color:rgba(245,184,65,.5);color:var(--lamp)}

/* ---------- 게임 ---------- */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;fill:var(--ink)}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.g{position:relative;display:grid;justify-items:center;gap:3px;padding-top:12px}
.g .dot{position:absolute;top:0;left:50%;width:0;height:0;border-radius:50%;background:var(--ink);transform:translateX(-50%);transition:width .15s,height .15s,top .15s}
.g .dot.s{width:7px;height:7px;top:2px}.g .dot.l{width:12px;height:12px;top:0}
.g .dot.q{background:transparent;border:2px solid var(--ink);box-sizing:border-box}
.g svg{width:38px;height:38px;overflow:visible}
.g .dim{color:rgba(214,222,255,.16)}.g .lit{color:var(--ink);transition:color .3s}
.g.up .lit{color:var(--good)}.g.down .lit{color:var(--bad)}
.g.warn .lit{color:var(--lamp)}
.g.up svg{animation:pop .5s}.g.down svg{animation:shake .45s}
.g span{font-size:11px;color:var(--muted)}
@keyframes pop{40%{transform:scale(1.22)}}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.stage{font-family:var(--display);font-size:15px;color:var(--lamp);letter-spacing:.02em}
.prog{flex:1;height:4px;border-radius:4px;background:rgba(214,222,255,.12);overflow:hidden;min-width:30px}
.prog i{display:block;height:100%;background:var(--lamp);border-radius:4px;transition:width .6s}
.val{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.ask{min-height:5.2em;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 4px 10px;font-size:clamp(16px,4.4vw,18.5px);line-height:1.6;text-wrap:balance}
.ask p{margin:0;max-width:30ch}
.table{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.deck{position:absolute;width:min(72vw,300px,calc((100% - 0px)));aspect-ratio:3/4;max-height:100%;border-radius:var(--r-card);background:var(--night-2);border:1px solid var(--line);transform:translateY(10px) scale(.95)}
.deck.b{transform:translateY(20px) scale(.9);opacity:.6}
.card{position:absolute;width:min(72vw,300px);aspect-ratio:3/4;max-height:100%;max-width:100%;border-radius:var(--r-card);background:var(--paper);color:var(--paper-ink);box-shadow:0 28px 50px -18px rgba(0,0,0,.7);overflow:hidden;touch-action:none;cursor:grab;will-change:transform}
.card:active{cursor:grabbing}
.card .art{position:absolute;inset:0 0 54px 0;overflow:hidden}
.card .art svg{width:100%;height:100%;display:block}
.card .who{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;flex-direction:column;justify-content:center;padding:0 16px;background:var(--paper)}
.card .who b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.card .who small{font-size:12.5px;color:var(--paper-mute)}
.card .opt{position:absolute;top:0;left:0;right:0;padding:16px 16px 34px;font-family:var(--display);font-size:21px;line-height:1.2;color:#fff;background:linear-gradient(rgba(10,14,30,.88),rgba(10,14,30,0));opacity:0;pointer-events:none;text-wrap:balance}
.card .opt.r{text-align:right}
.card.enter{animation:enter .42s cubic-bezier(.2,.9,.25,1.1)}
@keyframes enter{from{transform:translateY(26px) scale(.9) rotateY(70deg);opacity:0}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:50px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:14.5px;line-height:1.3;display:flex;align-items:center;gap:8px;text-align:left;transition:background .15s,border-color .15s}
.choice.r{justify-content:flex-end;text-align:right}
.choice .ar{font-family:var(--num);color:var(--muted);flex:none}
.choice.hot{border-color:var(--lamp);background:rgba(245,184,65,.14)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--muted);text-shadow:0 1px 6px var(--night)}.foot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-10px);z-index:5;max-width:92%;padding:10px 14px;border-radius:14px;background:var(--paper);color:var(--paper-ink);font-size:14px;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font-family:var(--display);font-weight:400}

/* ---------- 라운드 축하 ---------- */
.celebrate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,12,26,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.celebrate .box{text-align:center;display:grid;gap:10px;animation:rise .6s cubic-bezier(.2,.9,.25,1.2)}
.celebrate h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,60px);margin:0;color:var(--lamp);line-height:1}
.celebrate p{margin:0;color:var(--ink);font-size:16px}
@keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- 엔딩 ---------- */
.ending{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px;overflow-y:auto}
.ending .poster{position:relative;border-radius:var(--r-card);overflow:hidden;aspect-ratio:4/3.2;max-height:42vh;box-shadow:0 30px 60px -24px rgba(0,0,0,.8)}
.ending .poster svg{width:100%;height:100%;display:block}
.ending .poster.bad svg{filter:grayscale(.85) contrast(1.05)}
.ending .stamp{position:absolute;right:14px;top:14px;padding:6px 12px;border:3px solid currentColor;border-radius:8px;font-family:var(--display);font-size:18px;transform:rotate(8deg);background:rgba(255,255,255,.85)}
.ending .stamp.bad{color:#c62f2f}.ending .stamp.good{color:#1c8a5f}
.ending h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,54px);margin:0;line-height:1}
.ending .desc{margin:0;font-size:16px;line-height:1.65;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;gap:2px}
.stat small{font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.unlock{padding:12px 14px;border-radius:14px;border:1px dashed var(--lamp);color:var(--lamp);font-size:14px;line-height:1.5}
.unlock b{font-family:var(--display);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- 도감 ---------- */
.book{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.book h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;gap:10px;overflow-y:auto;padding-bottom:8px}
.ecard{border-radius:14px;overflow:hidden;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column}
.ecard .pic{flex:none;position:relative;height:0;padding-bottom:100%;background:var(--night-2);font-family:var(--display);font-size:34px;color:var(--muted)}
.ecard .pic>*{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center}
.ecard.bad .pic svg{filter:grayscale(.85)}
.ecard div.t{flex:none;padding:7px 8px 9px;font-size:12.5px;line-height:1.35;min-height:2.7em}
.ecard div.t b{display:block;font-family:var(--display);font-weight:400;font-size:14px}
.ecard.locked div.t{color:var(--muted)}

/* ---------- 시트 ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,10,22,.6)}
.sheet .in{width:100%;max-width:480px;box-sizing:border-box;background:var(--night-2);border-radius:22px 22px 0 0;border:1px solid var(--line);padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:12px;animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.tog{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:15px}
.tog i{width:44px;height:26px;border-radius:13px;background:rgba(214,222,255,.2);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tog[aria-pressed="true"] i{background:var(--lamp)}.tog[aria-pressed="true"] i::after{transform:translateX(18px)}
.howto{font-size:14px;line-height:1.65;color:var(--muted);margin:0}
.howto b{color:var(--ink);font-weight:400;font-family:var(--display)}

.classic{color:var(--muted);font-size:14px;text-decoration:none;font-family:var(--body)}
.iconbtn.mis{width:auto;min-width:40px;padding:0 6px;font-family:var(--num);font-size:12px;color:var(--lamp)}
.top{grid-template-columns:40px 1fr 52px!important}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px;min-height:0}
.items:empty{display:none}
.itm{padding:5px 10px;border-radius:999px;font-size:12.5px;background:var(--glass);border:1px solid var(--line)}
.itm.use{border-color:var(--lamp);color:var(--lamp);cursor:pointer}
.card.gold{box-shadow:0 0 0 3px var(--lamp),0 0 34px 4px rgba(245,184,65,.55),0 28px 50px -18px rgba(0,0,0,.7)}
.card.gold .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.4s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.goldtag{position:absolute;right:12px;bottom:16px;padding:4px 9px;border-radius:999px;background:var(--lamp);color:var(--lamp-ink);font-family:var(--display);font-size:13px}
.toast.gold{background:var(--lamp);color:var(--lamp-ink)}
.mlist{display:grid;gap:6px}
.mrow{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px;line-height:1.45}
.mrow span{color:var(--lamp);flex:none}.mrow b{font-weight:400;font-family:var(--display)}
.mrow.done{border-color:var(--lamp);color:var(--lamp)}
@media (max-height:680px){.ask{min-height:4.4em;padding-top:8px;font-size:15.5px}.g svg{width:32px;height:32px}.choices{margin-top:8px}.choice{min-height:44px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="ic-t" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="7.5" r="3.6"/><path d="M1.8 21c0-4.3 3.2-7 7.2-7s7.2 2.7 7.2 7z"/><circle cx="17.2" cy="8.6" r="2.9"/><path d="M15.6 13.3c3.8-.5 6.6 1.9 6.6 6.2h-4.6c0-2.5-.7-4.6-2-6.2z"/></g></symbol>

</svg>
<div class="app" id="app"></div>
<script>
'use strict';
/* ============ 유틸 ============ */
const R=Math.random,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),pick=a=>a[Math.floor(R()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=x=>clamp(Math.round(amt<0?x*(1+amt):x+(255-x)*amt),0,255);return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function fmtV(v){if(v>=10000)return (v/10000).toFixed(v>=100000?0:1).replace(/\.0$/,'')+'조';if(v>=1)return Math.round(v).toLocaleString('ko-KR')+'억';return Math.round(v*10)+'천만'}

/* ============ 등장인물 ============ */
const CH={
  cto:{n:'지훈',r:'공동창업자 · CTO',skin:'#f1c6a0',hair:'messy',hc:'#262626',wear:'hoodie',top:'#3d5a80',bg:'#9bc1bc',glasses:1},
  coo:{n:'서연',r:'공동창업자 · COO',skin:'#f6d1b1',hair:'long',hc:'#3b2a20',wear:'suit',top:'#e07a5f',bg:'#f2cc8f',earring:1},
  vc:{n:'박 이사',r:'VC 투자심사역',skin:'#eec39a',hair:'side',hc:'#1c1c1c',wear:'suit',top:'#2f3e46',tie:'#c1121f',bg:'#b8c0ff'},

function fixRun(r){r.items=r.items||{luck:0,life:0,card:0};if(!r.mis)r.mis=MISSIONS.slice().sort(()=>R()-.5).slice(0,3).map(m=>m.id);r.misDone=r.misDone||{};r.goldSeen=r.goldSeen||0;return r}

/* ---------- 게임 화면 ---------- */
const fillQ=q=>q.replace(/\{co\}/g,S.co);
function gaugeHTML(k){return `<div class="g" id="g-${k}"><i class="dot"></i><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="cl-${k}"><rect x="-2" width="28" height="28" y="${24*(1-S.g[k]/100)}"/></clipPath></defs><use href="#ic-${k}" class="dim"/><g clip-path="url(#cl-${k})"><use href="#ic-${k}" class="lit"/></g></svg><span>${GN[k]}</span></div>`}
function tGame(){
  app.innerHTML=`<div class="screen" id="gameScr"><div class="top"><button class="iconbtn" id="bMenu" aria-label="메뉴">${ICON_MENU}</button><div class="gauges" role="group" aria-label="회사 상태">${GK.map(gaugeHTML).join('')}</div><button class="iconbtn mis" id="bMis" aria-label="이번 창업 목표"><span id="misN"></span></button></div>
   <div class="status"><span class="stage" id="sStage"></span><span class="prog" title="다음 투자 라운드까지"><i id="sProg"></i></span><span class="mono" id="sMonth"></span><span class="val" id="sVal"></span></div>
   <div class="items" id="items"></div>
   <div class="ask" aria-live="polite"><p id="ask"></p></div>
   <div class="table" id="table"><div class="deck b"></div><div class="deck"></div><div class="toast" id="toast" role="status"></div></div>
   <div class="choices"><button class="choice" id="cL"><span class="ar">◀</span><span id="lL"></span></button><button class="choice r" id="cR"><span id="lR"></span><span class="ar">▶</span></button></div>
   <div class="foot"><span id="fWho"></span><span>${esc(S.co)} · ${esc(S.ceo)} 대표</span></div></div>`;
  on('#bMenu',pauseMenu);on('#bMis',()=>missions(false));document.getElementById('cL').onclick=()=>commit(-1);document.getElementById('cR').onclick=()=>commit(1);
  status();for(const k of GK)warnG(k);dealCard()}
function itemsBar(){const el=document.getElementById('items');if(!el)return;const I=S.items;
  el.innerHTML=Object.keys(ITEMS).filter(k=>I[k]>0).map(k=>k==='card'?`<button class="itm use" id="bSkip" title="${ITEMS[k].d}" aria-label="${ITEMS[k].n} ${I[k]}개, 눌러서 카드 넘기기">${ITEMS[k].e} 카드 넘기기 ×${I[k]}</button>`:`<span class="itm" title="${ITEMS[k].n}: ${ITEMS[k].d}" aria-label="${ITEMS[k].n} ${I[k]}개">${ITEMS[k].e} ×${I[k]}</span>`).join('');
  const b=document.getElementById('bSkip');if(b)b.onclick=()=>{if(LOCK)return;if(S.dyn){toast('투자 라운드와 상장 카드는 넘길 수 없습니다.');return}const el2=document.getElementById('card');if(!skipCard())return;LOCK=true;sfx('swipe');el2.style.transition='transform .3s,opacity .3s';el2.style.transform='translateY(-120%) rotate(-6deg)';el2.style.opacity='0';setTimeout(()=>{el2.remove();itemsBar();dealCard()},300)};
  const n=S.mis.filter(id=>S.misDone[id]).length;const mn=document.getElementById('misN');if(mn)mn.textContent=`★${n}/3`}
function status(){itemsBar();document.getElementById('sStage').textContent=S.stage>=5&&S.v>=IPO_AT?'상장 준비':STAGES[S.stage];
  const tgt=S.stage<5?ROUND_AT[S.stage]:IPO_AT,prev=S.stage>0?ROUND_AT[S.stage-1]:2;const pr=clamp(Math.log(S.v/prev)/Math.log(tgt/prev),0,1);
  document.getElementById('sProg').style.width=(pr*100)+'%';document.getElementById('sMonth').textContent=`${S.m+1}개월차`;document.getElementById('sVal').textContent=fmtV(S.v)}
let LOCK=false;
function dealCard(){const c=curCard(),P=CH[c.who];document.getElementById('ask').textContent=fillQ(c.q);
  document.getElementById('lL').textContent=c.L[0];document.getElementById('lR').textContent=c.R[0];document.getElementById('fWho').textContent=`${P.n} · ${P.r}`;
  const el=document.createElement('div');el.className='card enter'+(c.gold?' gold':'');if(c.gold){setTimeout(()=>{sfx('lucky');buzz([10,30,10])},200)}el.id='card';el.tabIndex=0;el.setAttribute('aria-label',`${P.n}의 카드. 왼쪽: ${c.L[0]}, 오른쪽: ${c.R[0]}`);
  el.innerHTML=`<div class="art">${portrait(c.who,c.m)}</div><div class="opt l">${esc(c.L[0])}</div><div class="opt r">${esc(c.R[0])}</div><div class="who"><b>${esc(P.n)}</b><small>${esc(P.r)}</small></div>${c.gold?'<span class="goldtag">황금 카드</span>':''}`;
  document.getElementById('table').appendChild(el);drag(el);LOCK=false}
function dots(pv){for(const k of GK){const d=document.querySelector(`#g-${k} .dot`);if(!d)continue;const x=pv&&pv[k];d.className='dot'+(x?' '+x.size+(x.q?' q':''):'')}}
function drag(el){let sx=0,dx=0,t0=0,id=null;const W=()=>el.offsetWidth;
  const show=()=>{const side=dx>0?1:-1,a=clamp((Math.abs(dx)-18)/60,0,1);el.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`;
    el.querySelector('.opt.r').style.opacity=dx>0?a:0;el.querySelector('.opt.l').style.opacity=dx<0?a:0;
    dots(Math.abs(dx)>26?preview(side):null);document.getElementById('cR').classList.toggle('hot',dx>26);document.getElementById('cL').classList.toggle('hot',dx<-26)};
  el.onpointerdown=e=>{if(LOCK)return;id=e.pointerId;el.setPointerCapture(id);sx=e.clientX;dx=0;t0=performance.now();el.style.transition='none';el.classList.remove('enter')};
  el.onpointermove=e=>{if(e.pointerId!==id)return;dx=e.clientX-sx;show()};
  el.onpointerup=el.onpointercancel=e=>{if(e.pointerId!==id)return;id=null;const vel=Math.abs(dx)/(performance.now()-t0);
    if(Math.abs(dx)>W()*.32||(vel>.7&&Math.abs(dx)>40))commit(dx>0?1:-1);else{el.style.transition='transform .35s cubic-bezier(.2,.9,.25,1.3)';dx=0;show();dots(null)}};
  el.onkeydown=e=>{if(e.key==='ArrowLeft')commit(-1);if(e.key==='ArrowRight')commit(1)}}
document.addEventListener('keydown',e=>{if(SCR!=='game'||document.querySelector('.sheet,.celebrate'))return;if(e.target.id==='card')return;if(e.key==='ArrowLeft')commit(-1);if(e.key==='ArrowRight')commit(1)});
function commit(side){if(LOCK||!S||S.over)return;LOCK=true;const el=document.getElementById('card');sfx('swipe');buzz(12);
  el.style.transition='transform .34s cubic-bezier(.4,0,.6,1),opacity .34s';el.style.transform=`translateX(${side*(innerWidth*.9)}px) translateY(-30px) rotate(${side*28}deg)`;el.style.opacity='0';
  document.getElementById('cR').classList.remove('hot');document.getElementById('cL').classList.remove('hot');dots(null);
  const r=apply(side);saveRun();
  let any=0;for(const k of GK){const d=r.d[k];if(Math.abs(d)>=1.5){any=1;tweenG(k,d)}else setG(k)}
  if(any){const up=GK.reduce((a,k)=>a+r.d[k],0)>=0;setTimeout(()=>sfx(up?'up':'down'),120)}
  const msgs=[];if(r.res)msgs.push(r.res);if(r.item)msgs.push(`${ITEMS[r.item].e} <b>${ITEMS[r.item].n}</b> 획득!`);if(r.saved)msgs.push(`🛟 <b>구명조끼 발동!</b> ${GN[r.saved]} 위기를 넘겼습니다.`);
  for(const m of r.mis||[])msgs.push(`★ <b>목표 달성</b> · ${esc(m.t)}<br>${ITEMS[m.it].e} ${ITEMS[m.it].n} 획득`);
  if(msgs.length){setTimeout(()=>{toast(msgs.join('<br>'),(r.mis&&r.mis.length)||r.saved?'gold':'');if(r.mis&&r.mis.length){sfx('stage');buzz([15,30,15])}else if(r.saved)sfx('lucky');else if(r.lucky!=null)sfx(r.lucky?'lucky':'down')},260)}
  setTimeout(()=>{el.remove();status();
    if(r.end){endFlow(r.end);return}
    const q=[];if(r.stageUp)q.push(n=>celebrate('투자 유치 완료',r.stageUp,`${S.co}의 기업가치 ${fmtV(S.v)}. 투자금이 입금됐습니다.`,n,true));
    if(r.year)q.push(n=>celebrate(`${r.year.y}년차 결산`,`${r.year.n===4?'완벽한 한 해':r.year.n===3?'괜찮은 한 해':'버텨낸 한 해'}`,`균형 잡힌 게이지 ${r.year.n}/4 · ${r.year.bonus}${r.year.item?` (${ITEMS[r.year.item].e} ${ITEMS[r.year.item].n})`:''}`,n,r.year.n===4));
    const run=()=>{const f=q.shift();if(f)f(()=>{status();run()});else dealCard()};run()},360)}
function setG(k){const rc=document.querySelector(`#cl-${k} rect`);if(rc)rc.setAttribute('y',24*(1-S.g[k]/100));warnG(k)}
function warnG(k){const g=document.getElementById('g-'+k);if(g)g.classList.toggle('warn',S.g[k]<=18||S.g[k]>=82)}
function tweenG(k,d){const g=document.getElementById('g-'+k),rc=document.querySelector(`#cl-${k} rect`);if(!g||!rc)return;const from=parseFloat(rc.getAttribute('y')),to=24*(1-S.g[k]/100),t0=performance.now();
  g.classList.remove('up','down');void g.offsetWidth;g.classList.add(d>0?'up':'down');
  const st=ts=>{const p=Math.min(1,(ts-t0)/520),e=1-Math.pow(1-p,3);rc.setAttribute('y',from+(to-from)*e);if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st);
  setTimeout(()=>{g.classList.remove('up','down');warnG(k)},900)}
let toastT=0;function toast(html,cls=''){const t=document.getElementById('toast');if(!t)return;t.innerHTML=html;t.className='toast on '+cls;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400+html.length*12)}
function confetti(){const box=document.createElement('div');box.className='confetti';const cols=['#f5b841','#5fd8ab','#ff6f6f','#8fa8ff','#ffffff'];
  box.innerHTML=Array.from({length:60},()=>`<i style="left:${Math.random()*100}%;background:${pick(cols)};animation-delay:${Math.random()*.8}s;animation-duration:${1.8+Math.random()*1.4}s"></i>`).join('');document.body.appendChild(box);setTimeout(()=>box.remove(),3600)}
function celebrate(eb,title,sub,then,party){sfx(party?'stage':'tap');if(party){buzz([20,40,20]);confetti()}const d=document.createElement('div');d.className='celebrate';
  d.innerHTML=`<div class="box"><span class="eyebrow">${esc(eb)}</span><h2>${esc(title)}</h2><p>${esc(sub)}</p><button class="btn main" id="bCel">계속</button></div>`;document.body.appendChild(d);
  const b=d.querySelector('#bCel');b.focus();b.onclick=()=>{sfx('tap');d.remove();then()}}

function sheet(html,bind){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="in" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d)d.remove()};bind(d,()=>d.remove());const f=d.querySelector('button');if(f)f.focus()}
function missions(intro){sheet(`<h3>${intro?'이번 창업의 목표':'목표'}</h3><p class="howto">달성할 때마다 ★과 아이템을 받습니다. 아이템은 위기에서 회사를 구합니다.</p>
  <div class="mlist">${S.mis.map(id=>{const M=MISSIONS.find(x=>x.id===id);return `<div class="mrow ${S.misDone[id]?'done':''}"><span>${S.misDone[id]?'★':'☆'}</span>${esc(M?M.t:id)}</div>`}).join('')}</div>
  <div class="mlist">${Object.entries(ITEMS).map(([k,v])=>`<div class="mrow"><span>${v.e}</span><div><b>${v.n}</b> · ${v.d}</div></div>`).join('')}</div><button class="btn main" id="bX">${intro?'시작하기':'닫기'}</button>`,(d,close)=>{d.querySelector('#bX').onclick=close})}
function settings(){let arm=false;sheet(`<h3>설정</h3><button class="tog" id="tS" aria-pressed="${!!META.sound}">효과음<i></i></button><button class="tog" id="tV" aria-pressed="${!!META.vibe}">진동<i></i></button><button class="btn sm" id="bReset">기록 초기화</button><button class="btn" id="bX">닫기</button>`,(d,close)=>{
  d.querySelector('#tS').onclick=e=>{META.sound=META.sound?0:1;e.currentTarget.setAttribute('aria-pressed',!!META.sound);saveMeta();sfx('tap')};
  d.querySelector('#tV').onclick=e=>{META.vibe=META.vibe?0:1;e.currentTarget.setAttribute('aria-pressed',!!META.vibe);saveMeta();buzz(20)};
  d.querySelector('#bReset').onclick=e=>{if(!arm){arm=true;e.currentTarget.textContent='한 번 더 누르면 모든 기록과 도감이 지워집니다';return}META={runs:0,best:0,bestM:0,ends:{},sound:META.sound,vibe:META.vibe,howto:1};saveMeta();ls.del(KEY_RUN);close();go('title')};
  d.querySelector('#bX').onclick=close})}
function howto(){sheet(`<h3>플레이 방법</h3><p class="howto">카드를 <b>왼쪽</b>이나 <b>오른쪽</b>으로 밀어 결정합니다. 아래 버튼을 눌러도 되고, 키보드 ← → 도 됩니다.</p>
  <p class="howto">위의 네 아이콘은 <b>현금 · 팀 · 고객 · 투자자</b>입니다. 카드를 밀기 시작하면 영향을 받는 아이콘 위에 점이 뜹니다. 큰 점은 큰 변화, 속이 빈 점은 운에 달린 변화입니다.</p>
  <p class="howto">어느 하나라도 <b>바닥나거나 꽉 차면</b> 게임이 끝납니다. 돈이 넘쳐도, 투자자 입김이 너무 세도 위험합니다. 매달 고정비로 현금이 조금씩 줄어듭니다.</p>
  <p class="howto">기업가치가 오르면 <b>투자 라운드</b>가 열리고, Pre-IPO 이후 기업가치 ${fmtV(IPO_AT)}을 넘기고 네 게이지가 모두 건강하면(20~85) <b>상장</b>에 도전할 수 있습니다. 엔딩은 모두 ${Object.keys(ENDS).length}가지입니다.</p><button class="btn main" id="bX">알겠어요</button>`,(d,close)=>{d.querySelector('#bX').onclick=close})}
function pauseMenu(){sheet(`<h3>${esc(S.co)} · ${S.m+1}개월차</h3><button class="btn main" id="bX">계속하기</button><button class="btn" id="bHow2">플레이 방법</button><button class="btn" id="bSet2">설정</button><button class="btn sm" id="bHome2">처음 화면으로 (자동 저장됨)</button>`,(d,close)=>{
  d.querySelector('#bX').onclick=close;d.querySelector('#bHow2').onclick=()=>{close();howto()};d.querySelector('#bSet2').onclick=()=>{close();settings()};d.querySelector('#bHome2').onclick=()=>{close();saveRun();go('title')}})}

/* ============ 시작 ============ */
function start(data){skyBuild();if(data&&data.S){S=data.S;go(data.scr==='game'&&!S.over?'game':data.scr==='end'&&S.endInfo?'end':'title')}else go('title')}
window.claude?.hot?.snapshot?.(()=>({S,scr:SCR}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
