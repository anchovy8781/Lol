<title>스타트업 생존기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 창업자의 운영 장부. 상단 KPI 원장 + 좌측 탭 작업영역 + 우측 '이번 달 시간표' 고정 패널 */
:root{
  --bg:#ECEFEA; --surface:#F8FAF6; --sunk:#E2E7E0; --ink:#18211C; --muted:#5B6860; --line:#CDD5CC;
  --accent:#1D6B4B; --accent-ink:#F4FAF6; --accent-soft:#D3E7DB;
  --good:#2C7A4B; --warn:#A96A12; --bad:#B23A28; --info:#2D5F8A; --up:#D0312D; --down:#1F5FC4;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --sunk:#202923; --ink:#E4EBE6; --muted:#93A399; --line:#2D3832;
  --accent:#62BD90; --accent-ink:#0D1510; --accent-soft:#1F3A2C;
  --good:#6BC48F; --warn:#E2AA4E; --bad:#EE7E68; --info:#7FB2DD; --up:#FF6B66; --down:#6AA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --sunk:#202923; --ink:#E4EBE6; --muted:#93A399; --line:#2D3832;
  --accent:#62BD90; --accent-ink:#0D1510; --accent-soft:#1F3A2C;
  --good:#6BC48F; --warn:#E2AA4E; --bad:#EE7E68; --info:#7FB2DD; --up:#FF6B66; --down:#6AA2FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.5px}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--sunk);font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em}
.date{font-family:var(--f-mono);font-size:13px;text-align:right}
.date b{font-size:20px;font-weight:600;display:block}

/* KPI ledger */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;font-family:var(--f-mono)}
.kpi.alert{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:960px){.side{position:static}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.bad>i{background:var(--bad)}.bar.warn>i{background:var(--warn)}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .row{gap:6px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:6px 6px}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.pl td:first-child{color:var(--muted)}
.pl tr.sum td{font-weight:700;color:var(--ink);border-top:2px solid var(--ink)}
.pl tr.sub td{font-weight:600;color:var(--ink)}

/* plan */
.act{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.act .n{font-weight:600}
.act .d{grid-column:1/2;font-size:11.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;grid-row:1/3;grid-column:2}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:700}
.stepper b{font-family:var(--f-mono);min-width:18px;text-align:center}
.blocks{display:flex;gap:3px;flex-wrap:wrap}
.blocks i{width:18px;height:18px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.blocks i.on{background:var(--accent);border-color:var(--accent)}

.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 8px;font-size:13px;min-width:70px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.log{display:flex;flex-direction:column;gap:0;max-height:520px;overflow:auto}
.log div{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:13px}
.log span:first-child{font-family:var(--f-mono);color:var(--muted);font-size:12px}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:640px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.sheet .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);padding:10px 12px;border-radius:var(--r);width:100%}
.choice:hover{border-color:var(--accent)}
.choice small{color:var(--muted);font-size:12px}
.choices{display:flex;flex-direction:column;gap:8px}

/* setup */
.setup{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.hero h1{font-size:clamp(34px,7vw,54px);line-height:1.05}
.hero p{max-width:62ch;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.opt b{font-size:14.5px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface));padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13px}
.callout.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.callout.good{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.ending h1{font-size:clamp(30px,6vw,46px)}
.sheet.wide{max-width:980px}
.up{color:var(--up)}.down{color:var(--down)}
.chip.upbg{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}.chip.downbg{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.lv-top{display:flex;gap:10px;align-items:center}
.lv-dot{background:var(--up);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:3px}
@media (prefers-reduced-motion:no-preference){.lv-dot{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.45}}.lv-msg{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}.flash{animation:fl .6s 2}@keyframes fl{50%{color:var(--up)}}}
.lv-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.lv-grid{grid-template-columns:minmax(0,1fr)}}
.lv-stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.lv-chat{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:flex;flex-direction:column;min-width:0}
.lv-ch{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.lv-msgs{height:330px;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.lv-msg b{color:var(--muted);font-weight:600;font-size:12px;margin-right:4px}
.lv-msg.up{color:var(--up)}.lv-msg.down{color:var(--down)}
.lv-count{font-size:22px;font-weight:600;text-align:center;padding:8px;border:1px dashed var(--line);border-radius:var(--r)}
.lv-big{font-size:30px;font-weight:600;line-height:1.1}
.lv-mid{font-size:19px;font-weight:600}
.lv-tbl td{padding:8px 6px}
.lv-px{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.lv-px svg{width:100%;height:120px}
.lv-verdict{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line)}
.lv-verdict b{font-family:var(--f-display);font-weight:400;font-size:28px}
.lv-verdict.up{border-color:var(--up);color:var(--up)}.lv-verdict.down{border-color:var(--down);color:var(--down)}
.lv-limit{align-self:flex-start;background:currentColor;border-radius:3px;padding:1px 8px;font-weight:700}
.lv-limit{color:inherit}.lv-verdict.up .lv-limit{background:var(--up);color:#fff}.lv-verdict.down .lv-limit{background:var(--down);color:#fff}
.cele{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sheet{position:relative}
.sheet.celeb{min-height:360px;justify-content:center;text-align:center;align-items:center}
.cele i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9}
@media (prefers-reduced-motion:no-preference){.cele i{animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}}
@media (prefers-reduced-motion:reduce){.cele{display:none}}
.cele-h{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,56px);color:var(--accent)}
.mentor{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.ap{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.ap.on{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.grade{font-family:var(--f-display);font-size:96px;line-height:1;color:var(--accent)}.grade.up{color:var(--up)}.grade.down{color:var(--down)}
.tkwrap{overflow:hidden;min-width:0;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tkrun{display:inline-flex;gap:40px;white-space:nowrap}
.tk em{font-style:normal;color:var(--up);font-weight:700}
@media (prefers-reduced-motion:no-preference){.tkrun{animation:tk 70s linear infinite}@keyframes tk{to{transform:translateX(-50%)}}.ticker:hover .tkrun{animation-play-state:paused}}
@media (prefers-reduced-motion:reduce){.tkrun{flex-direction:column;gap:4px;white-space:normal}.tkrun .tk:nth-child(n+4){display:none}}
.news{display:flex;flex-direction:column;max-height:640px;overflow:auto}
.nday{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:10px 0 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.nrow{display:flex;gap:6px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;flex-wrap:wrap}
.org{display:flex;flex-direction:column;align-items:center;gap:14px}
.orow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;border-top:2px solid var(--line);padding-top:14px;width:100%}
.obox{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;background:var(--bg);font-size:13px}
.obox.ceo{border-color:var(--accent);background:var(--accent-soft)}
.banner{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px}
@media (max-width:860px){.banner{grid-template-columns:minmax(0,1fr)}}
.banner>div{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bchap{border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))!important}
.btitle{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.vs{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:13px}
.vsbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bad) 55%,var(--sunk));overflow:hidden}
.vsbar i{display:block;height:100%;background:var(--accent)}
.quote{font-size:12.5px;color:var(--muted);font-style:italic}
.bdanger{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 10%,var(--surface))!important;justify-content:center}
.bdanger b{font-size:20px;color:var(--bad)}
.hand{display:flex;flex-direction:column;gap:8px}
.decide{border-color:var(--accent)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.btn.big{padding:12px 18px;font-size:15px;flex:1}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.card b{font-size:15px}.cfx{font-size:12.5px}
.card:disabled{opacity:.45}
.ctag{align-self:flex-start;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--sunk)}
.t-성장{background:color-mix(in srgb,var(--accent) 20%,transparent)}.t-도박{background:color-mix(in srgb,var(--warn) 25%,transparent)}.t-자금{background:color-mix(in srgb,var(--info) 22%,transparent)}.t-팀,.t-대표{background:color-mix(in srgb,var(--up) 15%,transparent)}
.bigres{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bigres>div{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--bg)}
.bigres .v{font-family:var(--f-mono);font-size:24px;font-weight:600}
.why{display:flex;flex-direction:column;gap:3px;font-size:13px}
.why span.p{color:var(--good)}.why span.m{color:var(--bad)}
.cardres{border-left:4px solid var(--accent);padding:8px 12px;background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface));border-radius:0 var(--r) var(--r) 0}
.board td{font-size:13px}
.linkish{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.linkish:hover{text-decoration:underline}.board tr.sel td{background:var(--sunk)}
.post{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.post .rep{font-size:13px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.stars{color:var(--warn);letter-spacing:1px}
.ticker{display:flex;gap:10px;align-items:baseline;font-size:13px;min-width:0}
.ticker b{flex:none;font-size:11px;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:1px 7px;border-radius:3px}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ach div{border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.ach div.on{opacity:1;border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 50%,var(--surface))}
.ach b{font-size:13px}.ach span{font-size:11.5px;color:var(--muted)}.ach em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
</style>

<div class="wrap" id="app"></div>

function simulate(){
  const I=ind(),A=s.alloc,F=s.F,m=s.month,cal=calM(m);
  {let over=allocTotal()-blocksAvail();for(const k of ['rest','gov','manage','recruit','ir','sales','interview','dev']){while(over>0&&A[k]>0){A[k]--;over--}}}
  const notes=[];const note=(t,c)=>{notes.push({t,c});addLog(t,m);if((c==='good'||c==='bad')&&R()<0.7)addNews(t,c)};
  const crunchM=s.crunch?1.22:1;
  // 특수 상태
  const poc=s.flags.poc?0.7:1;

  const devs=byRole('dev').length,pms=byRole('pm').length;
  const strikeM=s.flags.strike?0.35:1;if(s.flags.strike){note('파업 진행 중. 생산성과 영업이 크게 떨어졌습니다.','bad');delete s.flags.strike;s.flags.strikeEnd=1}
  let devPow=(pow('dev')*crunchM+A.dev*F.dev/8)*poc*CU().dev*strikeM*buffMul('dev');
  devPow*=1/(1+0.05*Math.max(0,devs-3)*(pms?0.45:1));
  if(s.debt>60)devPow*=1-(s.debt-60)/110;
  const sea=SEASON[s.ind][cal-1];
  let featPow=0;
  if(s.road.cur){featPow=devPow*s.road.share;devPow-=featPow;s.road.prog+=featPow*0.6;const ft=FEATS[s.ind].find(f=>f.k===s.road.cur);
    if(ft&&s.road.prog>=ft.c){for(const [k,v] of Object.entries(ft.fx)){if(k==='yieldAdd')s.fx[k]=(s.fx[k]||0)+v;else s.fx[k]=(s.fx[k]||1)*v}s.road.done.push(ft.k);s.road.cur=null;s.road.prog=0;s.debt=clamp(s.debt+4,0,100);note(`신규 기능 출시: ${ft.n}. ${ft.d}.`,'good');s.flags.launchShow={n:ft.n,d:ft.d};s.brand+=2}}
  const designPow=pow('design')*crunchM;
  const fq={feature:1.28,balance:1,stable:0.45}[s.focus];
  let dq=(devPow*0.13+designPow*0.05)*Math.pow(1-s.quality/104,1.4)*fq-(s.quality>I.mvp?0.35+Math.min(0.6,s.month*0.006)+s.comp*0.4:0.1);
  s.quality=clamp(s.quality+dq,0,100);
  const dd={feature:devPow*0.05,balance:devPow*0.018-0.4,stable:-devPow*0.07-0.8}[s.focus]+(s.crunch?1.2:0)+(s.users>tam()*0.05?0.6:0);
  s.debt=clamp(s.debt+dd,0,100);
  // ---- PMF ----
  const qF=s.quality/100;
  const target=s.fit*100*(0.28+0.72*qF);
  const rate=buffMul('pmf')*(CU().pmf||1)*clamp(0.035+0.035*A.interview+(s.users>=pmfN()?0.03:0)+pow('data')/60*0.03+pow('pm')/70*0.02,0,0.45);
  s.pmf=clamp(s.pmf+(target-s.pmf)*rate,0,100);
  s.flags.seNoise=rnd(-3,3);
  const pF=s.pmf/100;
  // ---- 브랜드 ----
  s.brand=clamp(s.brand*0.965+2*Math.log2(1+(s.ch.content||0)/3e6)+2.5*Math.log2(1+(s.ch.video||0)/4e6)+Math.log2(1+(s.ch.offline||0)/5e6)+pow('mkt')/90+(OFFICES[s.office].k||0)+(s.office==='gangnam'?0.6:0),0,100);
  // ---- 고객 획득 ----
  const gate=clamp((s.quality-I.mvp+8)/20+0.1,0.05,1)*(1+pow('design')/400);
  const pr=priceRatio();
  const pConv=(s.ind==='market'?Math.pow(pr,-0.6):Math.pow(pr,-1.3))*fxv('conv');
  const pChurn=s.ind==='market'?Math.pow(pr,0.3):Math.pow(pr,0.6);
  const salesPow=(pow('sales')/60+A.sales*(F.sales/60)/8*1.35)*CU().sales*strikeM;
  const mktMul=Math.min(2.4,1+pow('mkt')/140+pow('data')/300);
  const fit=CHFIT[s.ind],chs={};let paid=0,spendP=0;
  for(const k of ['search','social','video','offline']){const sp=s.ch[k]||0;if(sp<=0){chs[k]={sp:0,n:0,cac:0};continue}

function rollEvents(){
  const n=R()<0.62*D().ev?(R()<0.2*D().ev?2:1):0;const used=new Set();
  for(let k=0;k<n;k++){const pool=EVENTS.map((e,i)=>({i,w:used.has(i)?0:Math.max(0,e.w())}));const tot=pool.reduce((a,b)=>a+b.w,0);if(tot<=0)break;let x=R()*tot;const c=pool.find(p=>(x-=p.w)<=0);if(!c)break;used.add(c.i);s.pending.push(EVENTS[c.i].mk())}
}
function waterfall(price){
  // 비참가적 1x 청산우선권: 투자자는 (투자원금) vs (전환 후 지분가치) 중 큰 쪽
  let left=price;const out={me:0};const inv=s.cap.filter(c=>c.t==='inv');
  let convPct=0,prefPaid=0;
  const prefs=inv.filter(c=>c.inv>c.pct*price);
  for(const c of prefs){const p=Math.min(c.inv,left);left-=p;prefPaid+=p}
  const common=s.cap.filter(c=>!prefs.includes(c));convPct=common.reduce((a,c)=>a+c.pct,0);
  const me=s.cap.find(c=>c.t==='me');out.me=convPct>0&&me?left*me.pct/convPct:0;out.pref=prefPaid;return out;
}

function boardPost(kind,sent,ctx){const tk=BT[kind]?kind:sent;const title=fill(pick(BT[tk]),ctx);const body=pick(BODY[sent]||BODY.neu);
  const heat=sent==='vpos'||sent==='vneg'?3:sent==='neu'?1:2;const nr=ri(1,3+heat*2);
  return {id:s.nextId++,m:s.month,nick:nick(),title,body,views:ri(40,400)*heat,up:ri(0,25)*heat,down:ri(0,12)*heat,rep:Array.from({length:nr},()=>({n:nick(),t:pick(REPLY[sent])}))}}
function genBoard(chg){
  const P=s.pub;if(!P)return;s.board=s.board||[];const sent=sentKey(chg);const ctx={...chatCtx(),theme:s.flags.themeName||''};
  const n=Math.min(12,2+Math.floor(Math.abs(chg)*45));
  for(const k of (s.flags.boardCtx||[]))s.board.unshift(boardPost(k,k==='block'||k==='rights'||k==='earnMiss'?'vneg':k==='earnBeat'||k==='buyback'||k==='dividend'||k==='theme'?'vpos':sent,ctx));
  s.flags.boardCtx=[];
  const used=new Set(s.board.slice(0,40).map(p=>p.title));
  for(let i=0;i<n;i++){let po,k=0;do{po=boardPost(sent,R()<0.75?sent:pick(['pos','neu','neg']),ctx)}while(used.has(po.title)&&++k<8);if(k>=8)continue;used.add(po.title);s.board.unshift(po)}
  if(s.board.length>80)s.board.length=80;
}
function boardCtx(k){(s.flags.boardCtx=s.flags.boardCtx||[]).push(k)}

  const post={id:s.nextId++,m:s.month,nick:`${s.fname} (대표이사·인증)`,title:T[0],body:T[1],views:ri(3000,9000),up:ri(300,900),down:ri(50,400),ceo:true,

function genReview(){
  if(s.team.length<3)return;s.reviews=s.reviews||[];
  const avg=s.team.reduce((a,e)=>a+e.morale,0)/s.team.length;
  const pool=[];
  if(s.crunch)pool.push(['야근이 일상. 워라밸은 기대하지 마세요',2]);
  if(runway()<6)pool.push(['월급 밀릴까 봐 불안합니다. 투자 소식 기다리는 중',2]);
  if(s.team.some(e=>e.opt))pool.push(['스톡옵션 있어서 버팁니다. 상장하면 대박?',4]);
  if(avg>65)pool.push(['성장 속도가 빠르고 배울 게 많아요. 대표님 비전이 확실함',5],['동료들이 똑똑하고 수평적인 문화',5]);

  if(s.pub)pool.push(['상장사 타이틀은 좋은데 내부는 아직 스타트업',3]);

}

function priceRun(path,start,dur,base,onEnd){
  const n=path.length;for(let i=1;i<=n;i++)at(start+dur*i/n,()=>{const pts=path.slice(0,i);drawSpark(pts,base);const p=pts[pts.length-1],c=p/base-1;

function inboxTick(){s.inbox=s.inbox||[];
  for(const it of s.inbox.filter(x=>x.exp<=s.month)){const T=INBOX[it.k];const msg=T.o[T.dflt].f();addLog(`[메일 미응답] ${it.subj} → ${msg}`)}
  s.inbox=s.inbox.filter(x=>x.exp>s.month);
  const n=R()<0.55?1:R()<0.3?2:0;const keys=Object.keys(INBOX).filter(k=>INBOX[k].w()&&!s.inbox.some(x=>x.k===k)&&!((s.inboxSeen||{})[k]>s.month-8));
  for(let i=0;i<n&&keys.length;i++){const k=keys.splice(Math.floor(R()*keys.length),1)[0];const T=INBOX[k];s.inbox.push({id:s.nextId++,k,from:T.from(),subj:T.subj,body:T.body,m:s.month,exp:s.month+2});(s.inboxSeen=s.inboxSeen||{})[k]=s.month}}
function inboxAnswer(id,i,quiet){const it=(s.inbox||[]).find(x=>x.id===id);if(!it)return;const T=INBOX[it.k];const msg=T.o[i].f();sanitize();s.inbox=s.inbox.filter(x=>x!==it);addLog(`[메일] ${it.subj} → ${typeof T.o[i].t==='function'?T.o[i].t():T.o[i].t}: ${msg}`);if(!quiet)toast(msg)}
function inboxPanel(){const B=s.inbox||[];if(!B.length)return '';
  return `<div class="panel"><div class="row between"><h3>받은 편지함</h3><span class="chip">${B.length}</span></div>${B.map(it=>{const T=INBOX[it.k];return `<div class="post"><div class="row between"><b>${esc(it.subj)}</b><span class="note">${esc(it.from)} · ${it.exp-s.month<=1?'<span class="bad">이번 달 마감</span>':'2개월 내 회신'}</span></div><span class="note">${esc(it.body)}</span><div class="row">${T.o.map((o,i)=>`<button class="btn sm" data-mail="${it.id}" data-mi="${i}">${esc(typeof o.t==='function'?o.t():o.t)}</button>`).join('')}</div></div>`}).join('')}<p class="note">답하지 않으면 마감 후 기본 선택(보통 거절·보류)으로 처리됩니다.</p></div>`}

/* 최저임금 · 명절 · 노조 */
function laborTick(note){const cal=calM(s.month);
  if(cal===8){s.flags.minW=+rnd(1.5,7).toFixed(1);note(`최저임금위원회, 내년 최저임금 ${s.flags.minW}% 인상 의결.`)}
  if(cal===1&&s.flags.minW){const r=s.flags.minW/100;let n=0;for(const e of s.team)if(e.salary>0&&e.salary<3.0e7){e.salary*=1+r;n++}if(s.mfg&&s.mfg.workers){s.mfg.wage*=1+r*0.8;n+=s.mfg.workers}if(n)note(`최저임금 ${s.flags.minW}% 인상 적용: 저연봉 직원 ${n}명 임금 인상.`);delete s.flags.minW}
}

  {t:'명절 상여금 (월급의 50%)',d:won(pay*0.5*1.1),f:()=>{s.cash-=pay*0.5*1.1;s.team.forEach(e=>e.morale+=7);if(s.mfg)s.mfg.wMorale+=7;return '든든한 명절입니다.'}},
  {t:'선물세트 (인당 10만원)',d:won(n*1e5),f:()=>{s.cash-=n*1e5;s.team.forEach(e=>e.morale+=2);return '한우 세트는 아니어도 고맙다는 반응입니다.'}},
  {t:'이번엔 건너뛴다',d:'팀 사기 하락',f:()=>{s.team.forEach(e=>e.morale-=4);if(s.mfg)s.mfg.wMorale-=4;return '단톡방이 조용해졌습니다.'}}]}}
function unionTick(note){const n=s.team.length+(s.mfg?s.mfg.workers:0);if(n<100)return;
  const av=s.team.length?s.team.reduce((a,e)=>a+e.morale,0)/s.team.length:60;
  if(!s.union&&av<50&&R()<0.06){s.union={at:s.month,mem:Math.round(n*rnd(0.2,0.45))};note(`노동조합 설립 (조합원 ${num(s.union.mem)}명). 단체교섭 요구서가 접수됐습니다.`,'bad');s.flags.bargain=1}
  if(s.union&&calM(s.month)===4)s.flags.bargain=1}
function EV_BARGAIN(){const req=+rnd(5,9).toFixed(1);return {eb:'단체교섭',title:`노조가 임금 ${req}% 인상과 성과급 제도화를 요구합니다`,body:`조합원 ${num(s.union.mem)}명. 결렬되면 쟁의행위(파업)에 들어갈 수 있습니다. 파업 기간에는 생산성이 크게 떨어집니다.`,choices:[
  {t:`요구 수용 (${req}%)`,d:'임금 상승, 노사 관계 안정',f:()=>{s.team.forEach(e=>{if(!e.cof)e.salary*=1+req/100;e.morale+=8});if(s.mfg)s.mfg.wage*=1+req/100;return '임금협약 타결.'}},

/* 시장 디테일: 52주 신고가·신저가, 외국인 지분, 공매도 */
function marketDetail(P,note){const H=s.hist.slice(-12).map(h=>h.price).filter(Boolean);if(H.length>=6){const hi=Math.max(...H),lo=Math.min(...H);
    if(P.price>hi*1.001&&!(P.hiAt>s.month-3)){P.hiAt=s.month;note(`52주 신고가 경신: ${num(P.price)}원.`,'good');boardCtx('earnBeat')}
    if(P.price<lo*0.999&&!(P.loAt>s.month-3)){P.loAt=s.month;note(`52주 신저가: ${num(P.price)}원.`,'bad')}}
  const chg=P.price/(P.prev||P.price)-1;
  P.foreign=clamp((P.foreign??rnd(3,12))+chg*20+(s.esg&&s.esg.grade&&s.esg.grade.startsWith('A')?0.3:0)+(P.adr&&P.adr.on?0.4:0)+rnd(-0.8,0.8),0.5,55);
  P.short=clamp((P.short??rnd(0.5,3))-chg*15+(P.price<P.ipoPrice?0.3:-0.2)+rnd(-0.4,0.4),0.1,25)}

function drawHand(){const pool=CARDS.filter(c=>{try{return c.w()>0}catch(e){return false}});const hand=[];
  while(hand.length<3&&pool.length){const tot=pool.reduce((a,c)=>a+c.w(),0);let x=R()*tot,i=0;for(;i<pool.length-1;i++){x-=pool[i].w();if(x<=0)break}hand.push(pool.splice(i,1)[0].k)}
  if(hand.includes('star'))s.flags.starRole=pick(['dev','sales','pm','mkt','data']);
  s.hand=hand;s.pick=null}
function cardOf(k){return CARDS.find(c=>c.k===k)}
function playCard(){if(!s.pick)return null;const c=cardOf(s.pick);if(!c)return null;let cost=0;try{cost=c.cost()}catch(e){}if(cost>s.cash&&cost>0){toast('현금이 부족합니다.','bad');return null}
  const before={users:s.users,cash:s.cash};delete s.flags.cardMsg;c.go(cost);sanitize();gainXP(5);s.lastCard={k:c.k,n:c.n,m:s.month,before,msg:s.flags.cardMsg||''};addLog(`전략 카드: ${c.n}${s.flags.cardMsg?' — '+s.flags.cardMsg:''}`);
  return c}

  return `<section class="kpis" aria-label="핵심 지표">${k('현금',won(s.cash),!L?'':rw===Infinity?'흑자 경영':`${trim(rw,1)}개월 버팀`,rw<4?'alert':'')}${k('월 매출',L?won(L.rev):'0원',L?`<span class="${g>=0?'good':'bad'}">${sgn(g)}${pc(g)} / 월</span>`:'')}${k(ind().unit,num(s.users),L?`<span class="good">+${num(L.newU)}</span> <span class="bad">-${num(L.churned)}</span>`:'')}${k(s.pub?'시가총액':'기업가치',won(compVal()),`대표 지분 ${pc(myPct())}`)}${k('대표 체력',Math.round(s.F.energy),`Lv.${lvOf(s.F.xp)} ${titleOf(lvOf(s.F.xp))}`,s.F.energy<30?'alert':'')}</section>`}

function endGame(kind,value=0,who=''){
  if(s.ended)return;
  let wealth=0,title='',body='';
  const mp=myPct();
  if(kind==='delist'){wealth=s.wealth+value*mp;title='상장폐지';body=`관리종목 탈피에 실패해 상장폐지됐습니다. 정리매매 후 대표 지분가치 ${won(value*mp)}.`}
  else if(kind==='ipo'){wealth=value*mp;title='코스닥 상장';body=`공모가 기준 시가총액 ${won(value)}. 대표 지분 ${pc(mp)}의 평가가치 ${won(wealth)}. 상장 후 보호예수 기간 동안 주식을 팔 수 없습니다.`}
  else if(kind==='acquired'){wealth=s.wealth+waterfall(value).me;title='엑싯: 회사 매각';body=`${who}에 ${won(value)}에 매각. 투자자 청산우선권 반영 후 대표 몫 ${won(wealth)} (양도소득세 전).`}
  else if(kind==='acquihire'){wealth=waterfall(value).me;title='애크하이어';body=`팀과 기술을 ${won(value)}에 넘기고 회사를 정리했습니다. 대표 몫 ${won(wealth)}. 다음 창업을 위한 경험은 남았습니다.`}
  else if(kind==='bankrupt'){wealth=-(s.flags.personalDebt?5e7:0);title='폐업';body=`${s.month}개월 만에 문을 닫았습니다. 국내 스타트업의 5년 생존율은 약 33%입니다. 남은 것은 경험과${s.flags.personalDebt?' 개인 부채':' 교훈'}입니다.`}
  else if(kind==='burnout'){wealth=fairVal()*mp*0.2;title='번아웃';body='세 번째 응급실 이후 의사는 경영 일선에서 물러날 것을 강력히 권했습니다. 전문경영인을 선임하고 이사회에서 물러납니다.'}
  else if(kind==='timeout'){value=compVal();wealth=s.wealth+value*mp;title='10년 결산';body=`기업가치 ${won(value)}, 대표 지분 ${pc(mp)}. 지분가치 ${won(wealth)}.`}
  else if(kind==='quit'){wealth=s.wealth;title='자진 청산';body='대표가 사업을 접기로 했습니다.'}
  const grade=wealth>=1e11?'S':wealth>=1e10?'A':wealth>=1e9?'B':wealth>0?'C':'F';
  setTimeout(()=>hofUpdate(true),0);
  s.ended={kind,wealth,title,body,grade,m:s.month,unicorn:s.hist.some(h=>h.val>=1e12)||compVal()>=1e12};
  clearSave();
}

function chart(series,{h=210,fmt=won,from=null}={}){
  const H=from!=null?s.hist.filter(h=>h.m>=from):s.hist;if(H.length<2)return `<p class="muted note">다음 달부터 추이가 그려집니다.</p>`;
  const W=600,P={l:66,r:30,t:12,b:26};const n=H.length;

  mn=Math.min(0,mn);if(mx===mn)mx=mn+1;
  const x=i=>P.l+(W-P.l-P.r)*i/(n-1),y=v=>P.t+(h-P.t-P.b)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end" font-size="12.5" style="fill:var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(v)}</text>`}

  const lines=series.map(se=>{const pts=H.map((hh,i)=>`${x(i).toFixed(1)},${y(se.get(hh)).toFixed(1)}`);const last=H[n-1];

  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img">${g}${lines}</svg><div class="legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}</div></div>`}

function unitEcon(){
  const I=ind(),L=s.last;if(!L||s.users<1)return null;
  let arpu=0,gm=1;
  if(s.ind==='saas'){arpu=s.price;gm=0.85}
  else if(s.ind==='app'){arpu=L.rev/Math.max(1,s.users);gm=1-I.storeFee-0.05}
  else if(s.ind==='commerce'){arpu=L.rev/Math.max(1,s.users);gm=1-(L.lines.cogs+L.lines.ship+L.lines.pg+(L.lines.refund||0))/Math.max(1,L.lines.rev)}
  else{arpu=L.rev/Math.max(1,s.users);gm=1-L.lines.pg/Math.max(1,L.lines.rev)}
  const ltv=arpu*gm/Math.max(0.01,L.churnR);
  const blended=(L.lines.ad+L.lines.brandAd+payroll()*0.15)/Math.max(1,L.newU);
  if(s.ind==='saas')arpu*=fxv('arpu')*(1-s.annual*0.15);
  return {arpu,gm,ltv,cac:L.paid>0?L.effCAC:blended,ratio:ltv/Math.max(1,L.paid>0?L.effCAC:blended),payback:(L.paid>0?L.effCAC:blended)/Math.max(1,arpu*gm)};
}

function autoRun(n){let all=[],res=null,k=0;if(simple())s.pick=null;for(;k<n;k++){if(simple()){aiManage()}res=simulate();sanitize();all.push(...res.notes);if(s.ended||s.pending.length||s.cash<0)break}

function showReport(res){
  const L=res.rec;
  const items=res.notes.slice(-40).map(n=>`<li class="${n.c||''}">${esc(n.t)}</li>`).join('');
  queue.push({report:true,html:`<span class="eyebrow">${ym(L.m)} ${res.months>1?res.months+'개월 자동 진행':'월간 결산'}</span><h2>${calY(L.m)}년 ${calM(L.m)}월 마감</h2>

   <div class="bigres">
    <div><div class="note">현금</div><div class="v" data-cu="${Math.round(s.cash)}" data-fmt="won">${won(s.cash)}</div><div class="note mono ${L.net<0?'bad':'good'}">${L.net>=0?'+':''}${won(L.net)}</div></div>

   </div>
   <div class="why"><b>이번 달 변화의 이유</b>${reasons(L).map(([k,t_])=>`<div><span class="${k==='+'?'p':k==='-'?'m':''}">${k==='*'?'•':k}</span> ${esc(t_)}</div>`).join('')}</div>
   <details><summary class="note">세부 지표</summary><div class="grid3">

    <div><div class="note">순현금흐름</div><div class="mono ${L.net<0?'bad':'good'}" style="font-size:18px">${L.net>=0?'+':''}${won(L.net)}</div></div>

  const lv=s.pending.filter(e=>e.live);const rep=queue.pop();for(const x of lv)queue.push({live:x});queue.push(rep);

function nextModal(){
  if(s&&s.ended){queue=[];modal.hidden=true;render();return}
  const q=queue.shift();
  if(!q){modal.hidden=true;if(s&&!s.ended)save();render();return}
  modal.hidden=false;
  sheet.classList.remove('wide');
  if(q.live){const L=q.live;if(L.live==='lc')showLC(L.d);else if(L.live==='earnShow')showEarn(L.d);else if(L.live==='ipoShow')showIPO(L.d);else if(L.live==='launchDay')showLaunchDay(L.d);else if(L.live==='celebrate')showCelebrate(L.d);else if(L.live==='yearEnd')showYearEnd(L.d);else showLaunch(L.d);sheet._q=q;return}
  if(q.report){sheet.innerHTML=q.html+`<button class="btn primary" data-m="ok">확인</button>`;countUp(sheet)}
  else{const ev=q.ev;sheet.innerHTML=`<span class="eyebrow">${esc(ev.eb)}</span><h2>${esc(ev.title)}</h2><p>${esc(ev.body)}</p><div class="choices">${ev.choices.map((c,i)=>`<button class="choice" data-c="${i}"><b>${esc(c.t)}</b>${c.d?`<small>${esc(c.d)}</small>`:''}</button>`).join('')}</div>`;sheet._ev=ev}
  sheet._q=q;const b=sheet.querySelector('button');if(b)b.focus({preventScroll:true});
}
sheet.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.m==='ok'){nextModal();return}
  if(t.dataset.res==='ok'){const ev=sheet._ev;if(ev&&ev.crisis&&s.cash<0&&!s.ended){queue.unshift({ev:EV_CRISIS()})}nextModal();return}
  if(t.dataset.c!=null){const ev=sheet._ev,c=ev.choices[+t.dataset.c];const msg=c.f();sanitize();
    if(s.ended){nextModal();return}
    if(msg)addLog(`${ev.title} → ${msg}`,s.month-1);
    sheet.innerHTML=`<span class="eyebrow">${esc(ev.eb)}</span><h2>${esc(c.t)}</h2><p>${esc(msg||'결정했습니다.')}</p><button class="btn primary" data-res="ok">계속</button>`;sheet.querySelector('button').focus({preventScroll:true})}
});
function sanitize(){s.brand=clamp(s.brand,0,100);s.F.energy=clamp(s.F.energy,0,100);s.users=Math.max(0,s.users);s.debt=clamp(s.debt,0,100);s.pmf=clamp(s.pmf,0,100);for(const e of s.team)e.morale=clamp(e.morale,0,100)}

/* ============ 입력 ============ */
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.set){ui.setup[d.set]=d.set==='inf'?d.v==='1':d.v;render();return}
  if(d.tab){ui.tab=d.tab;ui.confirm=null;render();return}
  if(d.inc){if(allocTotal()<blocksAvail()){s.alloc[d.inc]++;render()}return}
  if(d.dec){if(s.alloc[d.dec]>0){s.alloc[d.dec]--;render()}return}
  if(d.focus){s.focus=d.focus;render();return}
  if(d.firec){ui.confirm='fire'+d.firec;render();return}
  if(d.fire){const emp=s.team.find(x=>x.id==d.fire);if(emp)fireEmp(emp);ui.confirm=null;sanitize();render();return}
  if(d.offer){const c=s.cands.find(x=>x.id==d.offer);if(!c)return;const mult=+d.m,opt=!!d.o;const p=offerChance(c,mult,opt);
    s.cands=s.cands.filter(x=>x!==c);
    if(R()<p){let g=0;if(opt){ensureEsop();g=Math.min(optGrant(c.lv),s.esopFree);s.esopFree-=g}
      s.team.push({id:c.id,name:c.name,role:c.role,lv:c.lv,skill:c.skill,salary:Math.round(c.ask*mult),morale:70+(opt?6:0),ten:0,ramp:0,opt:g,trait:c.trait||'none',mil:c.mil||0,leave:0});
      addLog(`${ROLES[c.role].name} ${c.name}(${LV[c.lv]}, 역량 ${c.skill}) 입사 확정. 연봉 ${won(c.ask*mult)}${g?`, 스톡옵션 ${pc(g,2)}`:''}.`);toast(`${c.name} 님이 오퍼를 수락했습니다.`,'good')}
    else{addLog(`${c.name}(${ROLES[c.role].name}) 오퍼 거절.`);toast(`${c.name} 님이 오퍼를 거절했습니다.`,'bad')}
    render();return}
  if(d.round){startRound(+d.round);render();return}
  if(d.accept){acceptOffer(+d.accept);render();return}
  if(d.gov){s.gov[d.gov]='apply';toast('신청 예약. 이번 달 "지원사업·행정"에 시간을 배정하세요.');render();return}
  if(d.ipo){startIPO(d.ipo);render();return}
  if(d.bulk){const role=(document.getElementById('bulkRole')||{}).value||'dev',n=+d.bulk;ui.bulkRole=role;const mk=ROLES[role].mk[1]*1e4;
    for(let i=0;i<n;i++)s.team.push({id:s.nextId++,name:pickName(),role,lv:1,skill:ri(42,66),salary:Math.round(mk*rnd(0.95,1.08)/1e6)*1e6,morale:66,ten:0,ramp:0,opt:0,trait:pick(TRAITS).k,mil:0,leave:0});
    s.cash-=n*5e6;addLog(`${ROLES[role].name} ${n}명 대량 채용 (수수료 ${won(n*5e6)}).`);toast(`${ROLES[role].name} ${n}명 입사 예정`,'good');render();return}
  if(d.post!=null){ui.post=+d.post||null;const p=(s.board||[]).find(x=>x.id===ui.post);if(p)p.views++;render();return}
  if(d.ceo){ceoPost(d.ceo);render();return}
  if(d.life){lifeAct(d.life);render();return}
  if(d.exp){runExp(d.exp);render();return}
  if(d.lc){startLiveCommerce(d.lc);return}
  if(d.card){s.pick=d.card;render();return}
  if(d.ncat){ui.newsCat=d.ncat;render();return}
  if(d.mail){inboxAnswer(+d.mail,+d.mi);render();return}
  if(d.adr){startADR(d.adr);render();return}
  if(d.esgrep){esgReport();render();return}
  if(d.esginv){esgInvest(d.esginv);render();return}
  if(d.buy!=null){buyPeer(+d.buy);render();return}
  if(d.cult){const had=s.culture&&s.culture!=='none';s.culture=d.cult;s.cultAt=s.month;if(had)s.team.forEach(e=>e.morale-=10);addLog(`기업 문화 ${had?'전환':'정립'}: ${CULTURES[d.cult].n}.`);toast(`기업 문화: ${CULTURES[d.cult].n}`,'good');sanitize();render();return}
  if(d.tev){teamEv(d.tev);render();return}
  if(d.feat){if(s.road.cur&&s.road.cur!==d.feat)addLog('개발 중이던 기능을 중단하고 우선순위를 바꿨습니다.');s.road.cur=d.feat;s.road.prog=0;render();return}
  if(d.cert2){const k=d.cert2,cost={venture:3e5,lab:5e5,isms:1.5e8}[k];s.cash-=cost;s.certLeft2[k]={venture:1,lab:1,isms:6}[k];s.certs[k]='review';addLog(`${{venture:'벤처기업 확인',lab:'기업부설연구소 인정',isms:'ISMS-P 인증'}[k]} 신청 (${won(cost)}).`);render();return}
  if(d.block){blockSale(+d.block);render();return}
  if(d.auto){ui.confirm=null;autoRun(+d.auto);return}
  if(d.enter){const mk=MARKETS.find(x=>x.k===d.enter);if(s.cash<mk.entry)return;s.cash-=mk.entry;s.markets[mk.k]={p:0,m:s.month};addLog(`${mk.name} 진출. 현지 법인 설립, 진출비 ${won(mk.entry)}.`);render();return}
  if(d.exit){const mk=MARKETS.find(x=>x.k===d.exit);delete s.markets[d.exit];addLog(`${mk.name} 시장 철수.`);render();return}
  if(d.site){const v=SITES[d.site],M=s.mfg,cost=v.buy+v.deposit;if(s.cash<cost){toast('현금이 부족합니다.','bad');return}if(v.lines<M.lines+M.building.length){toast('기존 라인을 수용할 수 없습니다.','bad');return}
    s.cash+=SITES[M.site].deposit;s.cash-=cost+3e7;M.site=d.site;M.siteVal=v.buy;addLog(`${v.name} 확보. ${v.buy?'매입가 '+won(v.buy):'보증금 '+won(v.deposit)}, 이전·설치비 3,000만.`);render();return}
  if(d.wk){const n=+d.wk,M=s.mfg;if(n>0){M.workers+=n;s.cash-=n*5e5;addLog(`생산직 ${n}명 채용.`)}else{const k=Math.min(M.workers,-n);M.workers-=k;s.cash-=k*M.wage/12;M.wMorale-=5;if(k)addLog(`생산직 ${k}명 감원. 해고예고수당 ${won(k*M.wage/12)}.`)}render();return}
  if(d.plan){s.mfg.plan=+d.plan;render();return}
  if(d.cert){const c=CERTS[d.cert];if(s.cash<c.cost)return;s.cash-=c.cost;s.mfg.certLeft[d.cert]=c.mo;addLog(`${c.name} 인증 심사 신청 (${won(c.cost)}).`);render();return}
  const a=d.act;
  if(a==='start'){const S=ui.setup;S.name=(document.getElementById('fname').value||'').trim();S.co=(document.getElementById('coname').value||'').trim();S.vest=document.getElementById('vest').checked;newGame(S);ui.tab='dash';render();window.scrollTo(0,0);return}
  if(a==='continue'){s=load();render();return}
  if(a==='restart'){apStop();s=null;ui.setup.carry=null;render();window.scrollTo(0,0);return}
  if(a==='showAll'){ui.showAll=!ui.showAll;if(!ui.showAll&&!['dash','team','inv','board','news','log'].includes(ui.tab))ui.tab='dash';render();return}
  if(a==='modeSwitch'){s.mode=simple()?'expert':'simple';if(simple())drawHand();render();return}
  if(a==='apStart'){apStart();return}
  if(a==='apStop'){apStop('정지했습니다.');return}
  if(a==='aiPlan'){aiManage();toast('AI 추천을 이번 달 계획에 적용했습니다.','good');render();return}
  if(a==='next'){if(AP.on)return;ui.confirm=null;if(simple()){aiManage();playCard()}const res=simulate();sanitize();if(!s.ended)save();showReport(res);return}
  if(a==='move'){const k=document.getElementById('office').value;if(k===s.office)return;const o=OFFICES[k];
    if(o.apply){s.gov.center='apply';toast('입주 신청서를 냈습니다. 다음 달 결과가 나옵니다.');render();return}
    s.cash+=s.deposit;s.deposit=o.deposit;s.cash-=o.deposit+o.move;s.office=k;addLog(`${o.name}(으)로 이전. 보증금 ${won(o.deposit)}, 이전·인테리어 ${won(o.move)}.`);render();return}
  if(a==='pivot'){ui.confirm='pivot';render();return}
  if(a==='pivotYes'){s.pivots++;s.quality*=0.4;s.users*=0.25;s.pmf*=0.3;s.fit=clamp(rnd(0.4,1)+0.04*s.pivots,0.3,1);s.debt*=0.6;ui.confirm=null;s.team.forEach(e=>e.morale-=6);addLog(`피벗 #${s.pivots}. 기존 가설을 버리고 새 문제를 정의합니다.`);render();return}
  if(a==='cancel'){ui.confirm=null;render();return}
  if(a==='abort'){addLog(`${ROUNDS[s.fund.i].name} 라운드 중단.`);s.fund=null;render();return}
  if(a==='rejectAll'){addLog('받은 텀시트를 모두 거절.');s.fund=null;render();return}
  if(a==='buildLine'){if(s.cash<LINE.capex*0.4){toast('착공 자금이 부족합니다.','bad');return}s.cash-=LINE.capex*0.4;s.mfg.building.push({left:LINE.build});addLog(`생산라인 착공. 선급금 ${won(LINE.capex*0.4)}.`);render();return}
  if(a==='rights'){rightsIssue();render();return}
  if(a==='buyback'){buyback();render();return}
  if(a==='dividend'){dividend();render();return}
  if(a==='kospi'){s.pub.market='KOSPI';s.pub.price*=1.08;s.pub.mcap=s.pub.price*s.pub.shares;s.brand+=8;addLog('유가증권시장(코스피) 이전상장. 패시브 자금 유입 기대.');render();return}
  if(a==='serial'){const E=s.ended;ui.setup.carry={cap:Math.max(5e7,Math.min(E.wealth*0.5,5e10)),keep:Math.max(0,E.wealth*0.5),gen:(s.gen||0)+1};ui.setup.bg='serial';s=null;render();window.scrollTo(0,0);return}
  if(a==='quit'){ui.confirm='quit';render();return}
  if(a==='quitYes'){endGame('quit');render();return}
  if(a==='theme'){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');return}
});
app.addEventListener('input',e=>{
  const t=e.target;if(!s)return;
  if(t.id==='price'){s.price=s.ind==='market'?ind().base*t.value/100:Math.round(ind().base*t.value/100/100)*100;document.getElementById('priceLbl').textContent=s.ind==='market'?pc(s.price,1):won(s.price)}
  if(t.id.startsWith('ch_')){const k=t.id.slice(3),v=+t.value;const amt=v===0?0:Math.round(Math.pow(10,5+v/100*5.3)/1e5)*1e5;s.ch[k]=amt;document.getElementById('chl_'+k).textContent=won(amt)}
  if(t.id==='roadShare'){s.road.share=+t.value/100;document.getElementById('roadLbl').textContent=pc(s.road.share,0)}
  if(t.id==='bonusRate'){s.bonus=s.bonus||{cycle:'none',type:'fixed',rate:0.1};s.bonus.rate=+t.value/100;document.getElementById('bonusLbl').textContent=pc(s.bonus.rate,0)}
  if(t.id==='annual'){s.annual=+t.value/100;document.getElementById('annLbl').textContent=pc(s.annual,0)}
  if(t.id==='fsal'){s.F.salary=+t.value*1e4;document.getElementById('salLbl').textContent=won(s.F.salary)}
});
app.addEventListener('change',e=>{
  const t=e.target;if(!s)return;
  if(t.id==='crunch'){s.crunch=t.checked;render()}
  if(t.id==='oem'){s.mfg.oem=t.checked;render()}
  if(t.id==='factor'){s.mfg.factor=t.checked;render()}
  if(t.id==='rfocus'){s.recruitFocus=t.value}
  if(t.id==='apStyle')AP.style=t.value;
  if(t.id==='apSpeed')AP.speed=+t.value;
  if(t.id==='apStopBig')AP.stop=t.checked;
  if(t.id==='bonusCycle'||t.id==='bonusType'){s.bonus=s.bonus||{cycle:'none',type:'fixed',rate:0.1};if(t.id==='bonusCycle')s.bonus.cycle=t.value;else{s.bonus.type=t.value;s.bonus.rate=t.value==='ps'?0.1:0.1}render()}
  if(t.id==='autoRec'){s.autoRec=t.value;addLog(`자동 레크리에이션 정책 변경: ${t.selectedOptions[0].textContent}`);render()}
  if(t.id==='bonusRate')render();
  if(['price','fsal','roadShare','annual'].includes(t.id)||t.id.startsWith('ch_'))render();
});
function toast(msg,c=''){const d=document.createElement('div');d.textContent=msg;d.className='chip '+c;d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;padding:8px 14px;font-size:13px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18)';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* 시작 */
function start(data){if(data&&data.s){s=data.s;ui=Object.assign(ui,data.ui||{})}render()}
if(window.claude?.hot){window.claude.hot.snapshot?.(()=>({s,ui}))}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
